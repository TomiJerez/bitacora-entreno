<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bitácora de Entreno</title>
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --bg:#F4F5F8;
    --surface:#FFFFFF;
    --surface-2:#EAECF1;
    --text:#12151B;
    --text-muted:#5B6472;
    --border:#DBDFE6;
    --accent:#4F7D00;
    --accent-contrast:#FFFFFF;
    /* Un color por dia de la semana, para distinguirlos en el Historial. */
    --day-mon:#2F6FD1; --day-tue:#7A4FD0; --day-wed:#C2407E; --day-thu:#1C8C83; --day-fri:#A87A12;
    --ok:#2E9D63;
    --ok-bg:#E4F5EC;
    --gold:#B4872A;
    --gold-bg:#FAF1DD;
    --danger:#D14F4F;
    --shadow: 0 1px 2px rgba(18,21,27,.06), 0 8px 24px -12px rgba(18,21,27,.18);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1116;
      --surface:#171B22;
      --surface-2:#1F252E;
      --text:#EEF0F3;
      --text-muted:#9AA3B2;
      --border:#2A303A;
      --accent:#B5E63C;
      --accent-contrast:#141A05;
      --day-mon:#5AA9FF; --day-tue:#B78CFF; --day-wed:#FF7AB6; --day-thu:#4FD1C5; --day-fri:#FFC857;
      --ok:#49C58A;
      --ok-bg:#123024;
      --gold:#E3B84F;
      --gold-bg:#2E2611;
      --danger:#F27070;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1116;
    --surface:#171B22;
    --surface-2:#1F252E;
    --text:#EEF0F3;
    --text-muted:#9AA3B2;
    --border:#2A303A;
    --accent:#B5E63C;
    --accent-contrast:#141A05;
      --day-mon:#5AA9FF; --day-tue:#B78CFF; --day-wed:#FF7AB6; --day-thu:#4FD1C5; --day-fri:#FFC857;
    --ok:#49C58A;
    --ok-bg:#123024;
    --gold:#E3B84F;
    --gold-bg:#2E2611;
    --danger:#F27070;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  button, input{font-family:inherit; color:inherit;}
  input, select, .grid-4 > *{min-width:0;}
  input:focus-visible, button:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:.2px; text-wrap:balance; margin:0;}

  #app{display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; position:relative;}

  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top,0px)) 20px 10px;
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-muted);
  }
  .topbar h1{font-size:26px; margin-top:2px;}
  /* Version visible para saber si el celu ya tiene la ultima. Tocarla busca
     actualizacion y recarga. */
  .top-actions{
    /* a la altura del titulo: arriba chocaba con la fecha larga */
    position:absolute; right:16px; top:calc(36px + env(safe-area-inset-top,0px));
    display:flex; flex-direction:column; align-items:flex-end; gap:4px;
  }
  .top-pills{display:flex; gap:6px; align-items:center;}
  /* Hora real, de referencia (no es un cronometro: no se guarda nada). */
  .clock{
    font-family:var(--font-mono); font-size:16px; font-weight:600; letter-spacing:.04em;
    font-variant-numeric:tabular-nums; color:var(--text);
  }
  .install-pill{
    font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px; border:none;
    background:var(--accent); color:var(--accent-contrast); cursor:pointer; touch-action:manipulation;
  }
  .version-pill{
    font-family:var(--font-mono); font-size:11.5px; font-weight:600; letter-spacing:.04em;
    padding:6px 10px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); cursor:pointer; touch-action:manipulation;
  }
  .version-pill.update{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
  .topbar .sub{color:var(--text-muted); font-size:13.5px; margin-top:2px; padding-right:96px;}

  main#view{
    flex:1; overflow-y:auto; padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:14px;
  }

  .tabbar{
    position:sticky; bottom:0; z-index:5;
    display:flex; gap:4px;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:transparent; border:none; border-radius:12px; padding:8px 4px;
    font-size:12px; font-weight:700; color:var(--text-muted); cursor:pointer;
    transition:color .2s, transform .12s; touch-action:manipulation;
  }
  .tab:active{transform:scale(.93);}
  .tab .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); transform:scale(0);
    transition:transform .35s cubic-bezier(.3,1.7,.5,1);}
  .tab.active{color:var(--accent);}
  .tab.active .dot{transform:scale(1);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:var(--shadow);
  }
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}

  .btn{
    appearance:none; border:none; border-radius:12px; padding:12px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-ghost{background:var(--surface-2); color:var(--text);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--border);}
  .btn.small{padding:8px 12px; font-size:13px; border-radius:10px;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.5;}

  .icon-btn{
    width:40px; height:40px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.armed{width:auto; padding:0 10px; font-size:12px; font-weight:700; background:var(--danger); border-color:var(--danger); color:#fff;}

  .pill{
    font-family:var(--font-mono); font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--text-muted);
  }
  .pill.ok{background:var(--ok-bg); color:var(--ok);}
  .pill.gold{background:var(--gold-bg); color:var(--gold);}

  .ex-card{border-top:1px solid var(--border); padding-top:14px;}
  .ex-card:first-child{border-top:none; padding-top:0;}
  .ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ex-name{font-weight:700; font-size:15.5px;}
  .ex-target{color:var(--text-muted); font-size:12.5px; margin-top:2px; font-family:var(--font-mono);}
  .ex-last{color:var(--text-muted); font-size:12.5px; margin-top:6px; background:var(--surface-2); padding:6px 10px; border-radius:8px; font-family:var(--font-mono);}

  /* El peso de la ultima vez se ve igual que uno cargado: tildar sin tocarlo
     lo guarda (ver toggleExDone). Sin historial queda el guion apagado. */
  .num-input.has-last::placeholder{color:var(--text); opacity:1;}
  .num-input{
    width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:10px; padding:11px 10px; font-family:var(--font-mono); font-size:17px; font-variant-numeric:tabular-nums;
    text-align:center;
  }

  /* Fila principal del ejercicio: el peso (o la duracion) y el tilde. */
  .done-card{text-align:center; padding:26px 16px;}
  .done-mark{
    width:56px; height:56px; margin:0 auto 12px; border-radius:50%;
    background:var(--ok); color:#fff; font-size:30px; line-height:56px; font-weight:700;
  }
  .done-card h2{font-size:22px;}
  .done-card .ex-target{margin-top:4px;}
  .done-count{
    margin-top:10px; display:inline-block; background:var(--ok-bg); color:var(--ok);
    border-radius:999px; padding:5px 12px; font-family:var(--font-mono); font-size:13px; font-weight:600;
  }
  .done-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:11px 0; border-top:1px solid var(--border); font-size:14.5px;
  }
  .done-row:first-child{border-top:none;}
  .done-row.skipped{color:var(--text-muted);}
  .done-val{font-family:var(--font-mono); font-weight:600; flex:none;}

  .ex-actions{display:flex; gap:6px; flex:none;}
  .ex-rename{
    width:100%; font-weight:700; font-size:15.5px; border:1px solid var(--accent);
    background:var(--bg); color:var(--text); border-radius:8px; padding:5px 8px;
  }
  .ex-main{display:flex; align-items:flex-end; gap:10px; margin-top:10px;}
  .ex-main .field{flex:1;}
  .ex-card.done .num-input{border-color:var(--ok); background:var(--ok-bg);}
  .ex-card.done .ex-name{color:var(--text-muted); text-decoration:line-through;}

  .check-btn{
    width:52px; height:46px; flex:none; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-muted); font-size:20px; font-weight:700; cursor:pointer; opacity:.45;
  }
  .check-btn.on{opacity:1;}
  .check-btn.on{background:var(--ok); border-color:var(--ok); color:#fff;}

  /* Opciones de duracion del cardio. */
  .cardio-opts{display:flex; gap:6px; flex:1;}
  .cardio-opts button{
    flex:1; padding:12px 8px; border-radius:12px; border:1px solid var(--border); background:var(--bg);
    color:var(--text-muted); font-family:var(--font-mono); font-size:15px; font-weight:600; cursor:pointer;
  }
  .cardio-opts button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}

  .ghost-btn{
    margin-top:10px; background:none; border:1px dashed var(--border); color:var(--text-muted);
    border-radius:10px; padding:8px; font-size:13px; font-weight:700; cursor:pointer; width:100%;
  }

  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  input[type="text"], input[type="number"], input[type="search"], select{
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:10px; padding:10px; font-size:16px; width:100%;   /* 16px: menos que eso y iOS hace zoom al tocar */
  }
  .grid-4{display:grid; grid-template-columns:1.7fr 0.8fr 0.9fr 0.8fr; gap:6px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  .empty{color:var(--text-muted); font-size:14px; text-align:center; padding:30px 10px;}

  /* Barra del modo prueba. Deliberadamente chillona: no tiene que pasar
     desapercibida ni confundirse con la app real. */
  .test-bar{
    background:var(--gold-bg); color:var(--text); border-bottom:1px solid var(--border);
    padding:10px 16px; display:flex; flex-direction:column; gap:8px; font-size:12.5px;
  }
  .test-bar .test-title{font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--gold);}
  .test-bar .test-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .test-bar input[type="date"]{
    flex:1; min-width:140px; border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:9px; padding:7px 8px; font-family:var(--font-mono); font-size:13px;
  }
  .test-bar button{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:9px; padding:7px 10px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .test-bar button.danger{color:var(--danger); border-color:currentColor;}

  .history-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 0; border-top:1px solid var(--border); cursor:pointer; background:none; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left;
  }
  .history-item:first-child{border-top:none;}
  .history-item{position:relative; padding-left:14px; --dc:var(--text-muted); transition:transform .12s;}
  .history-item:active{transform:scale(.985);}
  .history-item::before{
    content:''; position:absolute; left:0; top:12px; bottom:12px; width:4px; border-radius:4px;
    background:var(--dc); transform-origin:top;
    animation:grow .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i, 0) * 35ms + .1s);
  }
  .history-item .pill{
    background:color-mix(in srgb, var(--dc) 16%, transparent); color:var(--dc);
    animation:pop .4s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(var(--i, 0) * 35ms + .15s);
  }
  .history-item[data-day="mon"]{--dc:var(--day-mon);}
  .history-item[data-day="tue"]{--dc:var(--day-tue);}
  .history-item[data-day="wed"]{--dc:var(--day-wed);}
  .history-item[data-day="thu"]{--dc:var(--day-thu);}
  .history-item[data-day="fri"]{--dc:var(--day-fri);}
  .history-date{font-weight:700; font-size:14.5px;}
  .history-sub{color:var(--text-muted); font-size:12.5px; margin-top:2px;}

  /* Historial: el grafico queda fijo arriba y la lista scrollea abajo. */
  #view.split{overflow:hidden; padding-bottom:12px;}
  .hist-list{flex:1; min-height:0; overflow-y:auto; margin:0 -16px; padding:0 16px 24px;}
  .heat-card{flex:none; padding:14px 16px 12px;}
  .heat-stats{display:flex; gap:16px; margin-bottom:10px;}
  .heat-stat b{display:block; font-family:var(--font-display); font-size:20px; font-weight:600; line-height:1.1;}
  .heat-stat b small{font-size:13px; color:var(--text-muted);}
  .heat-stat span{color:var(--text-muted); font-size:11.5px;}
  .heat{display:grid; grid-template-columns:14px repeat(var(--weeks), minmax(0, 1fr)); gap:3px; align-items:center;}
  .heat .mlabel{font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; height:13px; line-height:13px; overflow:visible; min-width:0;}
  .heat .dlabel{font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); text-align:center;}
  .heat .cell{
    aspect-ratio:1; border-radius:4px; border:none; padding:0; background:var(--surface-2);
    animation:pop .35s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(var(--c, 0) * 18ms);
  }
  .heat .cell.none{opacity:.45;}
  .heat .cell.rest{opacity:.25;}
  .heat .cell.miss{background:color-mix(in srgb, var(--danger) 28%, var(--surface-2));}
  .heat .cell.future{background:transparent; box-shadow:inset 0 0 0 1px var(--border); opacity:.5;}
  .heat .cell.did{background:var(--dc, var(--accent)); cursor:pointer; touch-action:manipulation;}
  .heat .cell.did:active{transform:scale(.85);}
  .heat .cell.today{opacity:1; box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent);}
  .heat .cell[data-day="mon"]{--dc:var(--day-mon);}
  .heat .cell[data-day="tue"]{--dc:var(--day-tue);}
  .heat .cell[data-day="wed"]{--dc:var(--day-wed);}
  .heat .cell[data-day="thu"]{--dc:var(--day-thu);}
  .heat .cell[data-day="fri"]{--dc:var(--day-fri);}
  .heat-legend{display:flex; gap:12px; margin-top:10px; color:var(--text-muted); font-size:11px; align-items:center; flex-wrap:wrap;}
  .heat-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  .heat-legend .l-did{background:linear-gradient(90deg, var(--day-mon), var(--day-tue), var(--day-wed), var(--day-thu), var(--day-fri));}
  .heat-legend .l-miss{background:color-mix(in srgb, var(--danger) 28%, var(--surface-2));}

  .install-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px 14px; font-size:13px;
  }
  .install-banner p{margin:0; color:var(--text-muted); line-height:1.4;}
  .install-banner .icon-btn{flex:none;}

  .day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .day-tabs button{
    flex:none; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-muted); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .day-tabs button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}

  /* ---------- carga rapida de peso ---------- */
  .weight-row{display:grid; grid-template-columns:46px 1fr 46px; gap:6px;}
  .step-btn{
    height:46px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:22px; font-weight:700; line-height:1; cursor:pointer;
    touch-action:manipulation;
  }
  .step-btn:active{transform:scale(.92);}
  .ex-last.use-last{
    display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%;
    border:1px dashed var(--border); text-align:left; cursor:pointer; touch-action:manipulation;
  }
  .ex-last .use-tag{font-weight:600; color:var(--accent); flex:none;}

  /* ---------- progreso del dia ---------- */
  .progress{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progress > span{
    display:block; height:100%; width:0; border-radius:inherit; background:var(--accent);
    transition:width .45s cubic-bezier(.2,.8,.2,1), background-color .3s;
  }
  .progress.full > span{background:var(--ok);}

  /* ---------- movimiento ---------- */
  .ex-card{transition:opacity .25s;}
  .ex-card .ex-name{transition:color .25s;}
  .check-btn, .cardio-opts button{transition:background-color .2s, border-color .2s, color .2s, opacity .2s, transform .1s; touch-action:manipulation;}
  .check-btn:active, .cardio-opts button:active, .btn:active{transform:scale(.95);}
  .check-btn.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1);}
  .pill.bump{animation:bump .35s ease-out;}
  .num-input.flash{animation:flash .45s ease-out;}

  /* El ejercicio recien tildado larga un halo verde. */
  .ex-card.glow{animation:glow .8s ease-out;}
  /* Al completar el dia la barra hace un brillo que la cruza una vez. */
  .progress > span{position:relative; overflow:hidden;}
  .progress.shine > span::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.55) 50%, transparent 80%);
    animation:sweep .9s .2s ease-out both;
  }
  .use-last{transition:transform .1s, border-color .2s;}
  .use-last:active{transform:scale(.98); border-color:var(--accent);}
  .use-last .use-tag{transition:transform .15s;}
  .use-last:active .use-tag{transform:translateX(3px);}
  /* "Nueva version" late suave para que se note. */
  .version-pill.update{animation:breathe 1.8s ease-in-out infinite;}
  .topbar .swap{animation:rise .3s cubic-bezier(.2,.8,.2,1) both;}
  .topbar .sub.swap{animation-delay:.05s;}
  /* Con todo tildado, "Terminar dia" late para invitar a cerrarlo. */
  .btn[data-action="finishDay"].ready{animation:breathe 1.6s ease-in-out infinite;}
  /* Rutina: el dia elegido pasa con un toque de rebote. */
  .day-tabs button{transition:background-color .2s, border-color .2s, color .2s, transform .12s;}
  .day-tabs button:active{transform:scale(.94);}
  .day-tabs button.active{animation:pop .35s cubic-bezier(.3,1.6,.5,1);}
  /* Paso de los botones -/+: el numero salta un poquito. */
  .num-input.nudge-up{animation:nudgeUp .25s ease-out, flash .45s ease-out;}
  .num-input.nudge-down{animation:nudgeDown .25s ease-out, flash .45s ease-out;}

<script>
(function(){
  'use strict';

  /* ---------- constantes ---------- */
  /* Modo prueba: se activa con ?test en la URL. Usa claves de localStorage
     propias, asi que nada de lo que se haga aca toca el historial real. */
  var TEST_MODE = /(^|[?&#])test(=|&|$)/.test(location.search + location.hash);
  var SUF = TEST_MODE ? '_test' : '';

  var LS_TEMPLATE = 'bitacora_template_v1' + SUF;
  var LS_SESSIONS = 'bitacora_sessions_v1' + SUF;
  var LS_UI = 'bitacora_ui_v1' + SUF;
  var LS_TESTDATE = 'bitacora_test_date';
  var LS_TPLVER = 'bitacora_template_version' + SUF;

  var DAY_ORDER = ['mon','tue','wed','thu','fri'];
  var DAY_LABEL = {mon:'Lunes',tue:'Martes',wed:'Miércoles',thu:'Jueves',fri:'Viernes',sat:'Sábado',sun:'Domingo'};
  var WEEKDAY_MAP = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri',6:'sat',0:'sun'};

  /* ---------- utilidades ---------- */
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function isoDate(d){ d = d || new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function weekdayKeyOf(d){ d = d || new Date(); return WEEKDAY_MAP[d.getDay()]; }

  /* En modo prueba "hoy" puede ser cualquier dia, para poder recorrer la semana. */
  function today(){
    if(TEST_MODE){
      var d = safeGet(LS_TESTDATE);
      if(d) return parseIso(d);
    }
    return new Date();
  }
  function parseIso(dateStr){
    var p = dateStr.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function fmtDateLong(dateStr){
    var d = parseIso(dateStr);
    var opts = { weekday:'long', day:'numeric', month:'long' };
    var s = d.toLocaleDateString('es-AR', opts);
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function fmtDateShort(dateStr){
    var d = parseIso(dateStr);
    return d.toLocaleDateString('es-AR', {day:'numeric', month:'short'});
  }

  /* ---------- datos por defecto ---------- */
  /* Reps de 8-12. Los dias de 3 ejercicios van a 5 series, los de 4 a 4.
     El cardio no usa series ni kg, solo una duracion que se elige en el
     momento (ya no esta en la rutina, pero se puede agregar suelto). */
  var DEFAULT_SETS = 4, DEFAULT_REPS = '8-12', CARDIO_OPTIONS = [10, 15];

  function ex(name, sets){ return {id:uid(), name:name, kind:'strength', targetSets:sets || DEFAULT_SETS, targetReps:DEFAULT_REPS}; }
  function cardio(name){ return {id:uid(), name:name, kind:'cardio', options:CARDIO_OPTIONS.slice()}; }

  function defaultTemplate(){
    return {
      mon:{ focus:'Pecho / Tríceps', exercises:[
        ex('Pecho plano', 5),
        ex('Pecho aperturas', 5),
        ex('Tríceps con barra', 5)
      ]},
      tue:{ focus:'Espalda / Bíceps', exercises:[
        ex('Jalón al pecho'),
        ex('Remo'),
        ex('Bíceps martillo'),
        ex('Bíceps supino')
      ]},
      wed:{ focus:'Piernas', exercises:[
        ex('Cuádricep', 5),
        ex('Isquio', 5),
        ex('Ad/abductores o prensa', 5)
      ]},
      thu:{ focus:'Hombro / Tríceps', exercises:[
        ex('Press hombro máquina', 5),
        ex('Vuelos', 5),
        ex('Tríceps con cinta', 5)
      ]},
      fri:{ focus:'Pecho / Espalda / Hombro / Bíceps', exercises:[
        ex('Pecho inclinado'),
        ex('Jalón al pecho'),
        ex('Press militar'),
        ex('Bíceps supino')
      ]}
    };
  }

  /* ---------- migracion de datos viejos ----------
     El formato anterior guardaba un array `sets` por ejercicio, con kg y reps
     por serie, y un `restSec` para el timer. Ahora es un peso por ejercicio y
     un tilde. Esto convierte lo que ya este en localStorage en vez de perderlo. */
  function migrateTemplateExercise(e){
    if(e.kind) return e;
    var isCardio = /cinta|caminata|bici|eliptic/i.test(e.name || '');
    var out = {id: e.id || uid(), name: e.name, kind: isCardio ? 'cardio' : 'strength'};
    if(isCardio){ out.options = CARDIO_OPTIONS.slice(); }
    else { out.targetSets = DEFAULT_SETS; out.targetReps = DEFAULT_REPS; }
    return out;
  }

  function migrateSessionExercise(e){
    if(e.kind && !e.sets) return e;
    var isCardio = e.kind === 'cardio' || /cinta|caminata|bici|eliptic/i.test(e.name || '');
    var out = {name: e.name, kind: isCardio ? 'cardio' : 'strength'};
    var sets = e.sets || [];
    out.done = sets.length > 0 && sets.every(function(s){ return s.done; });
    if(isCardio){
      out.options = e.options || CARDIO_OPTIONS.slice();
      out.minutes = e.minutes != null ? e.minutes : null;
    } else {
      out.targetSets = e.targetSets || DEFAULT_SETS;
      out.targetReps = e.targetReps || DEFAULT_REPS;
      // el peso del ejercicio es el ultimo que se haya anotado en alguna serie
      var weights = sets.map(function(s){ return s.weight; }).filter(function(w){ return w !== '' && w != null; });
      out.weight = e.weight != null ? e.weight : (weights.length ? weights[weights.length-1] : '');
    }
    return out;
  }

  /* Cambios a la rutina por defecto que tienen que llegar a plantillas ya
     guardadas. Sin esto, tocar defaultTemplate() no cambia nada en un celu que
     ya tiene su plantilla: loadTemplate la devuelve tal cual. Cada parche
     corre una sola vez, segun la version guardada, asi que si despues renombras
     el ejercicio a mano no te lo volvemos a pisar. */
  var TEMPLATE_VERSION = 3;

  var TEMPLATE_PATCHES = [
    // 1 -> 2: el press militar del jueves pasa a maquina
    function(t){
      if(!t.thu || !Array.isArray(t.thu.exercises)) return;
      t.thu.exercises.forEach(function(e){
        if(e.name === 'Press militar') e.name = 'Press hombro máquina';
      });
    },
    // 2 -> 3: sale la cinta; los dias que quedan con 3 ejercicios van a 5 series.
    // Solo se tocan las series que siguen en el valor por defecto (4).
    function(t){
      DAY_ORDER.forEach(function(k){
        var day = t[k];
        if(!day || !Array.isArray(day.exercises)) return;
        day.exercises = day.exercises.filter(function(e){ return !(e.kind === 'cardio' && e.name === 'Cinta'); });
        var strength = day.exercises.filter(function(e){ return e.kind === 'strength'; });
        if(strength.length === 3 && day.exercises.length === 3){
          strength.forEach(function(e){ if(e.targetSets === DEFAULT_SETS) e.targetSets = 5; });
        }
      });
    }
  ];

  function applyTemplatePatches(t){
    var from = parseInt(safeGet(LS_TPLVER), 10) || 1;
    for(var v = from; v < TEMPLATE_VERSION; v++){
      var patch = TEMPLATE_PATCHES[v - 1];
      if(patch){ try{ patch(t); }catch(e){} }
    }
    safeSet(LS_TPLVER, String(TEMPLATE_VERSION));
    return t;
  }

  function migrateTemplate(t){
    DAY_ORDER.forEach(function(k){
      if(t[k] && Array.isArray(t[k].exercises)) t[k].exercises = t[k].exercises.map(migrateTemplateExercise);
    });
    return t;
  }

  function migrateSessions(all){
    Object.keys(all).forEach(function(d){
      var sess = all[d];
      if(sess && Array.isArray(sess.exercises)) sess.exercises = sess.exercises.map(migrateSessionExercise);
      if(sess) delete sess.startedAt;   // ya no se mide la duracion del entreno
    });
    return all;
  }

  /* ---------- persistencia ---------- */
  function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function safeSet(key, val){ try{ localStorage.setItem(key, val); return true; }catch(e){ return false; } }

  function loadTemplate(){
    var raw = safeGet(LS_TEMPLATE);
    if(raw){ try{
      var t = applyTemplatePatches(migrateTemplate(JSON.parse(raw)));
      safeSet(LS_TEMPLATE, JSON.stringify(t));   // persistir la migracion, no solo aplicarla en memoria
      return t;
    }catch(e){} }
    var t = defaultTemplate();
    safeSet(LS_TEMPLATE, JSON.stringify(t));
    safeSet(LS_TPLVER, String(TEMPLATE_VERSION));   // ya nace al dia: no hay parches que aplicar
    return t;
  }
  function saveTemplate(){ safeSet(LS_TEMPLATE, JSON.stringify(state.template)); }

  function loadSessions(){
    var raw = safeGet(LS_SESSIONS);
    if(raw){ try{
      var all = migrateSessions(JSON.parse(raw));
      safeSet(LS_SESSIONS, JSON.stringify(all));
      return all;
    }catch(e){} }
    return {};
  }
  /* Abrir la app en un dia de rutina crea la sesion para poder mostrarla, pero
     si no se toca nada no tiene que quedar registrada: sin esto, mirar la app
     tres dias seguidos dejaba tres dias "0/4" en el historial, y eso ensucia
     cualquier analisis de adherencia o evolucion. */
  function sessionHasData(s){
    return (s.exercises || []).some(function(e){
      return e.done || (e.weight !== '' && e.weight != null) || e.minutes;
    });
  }

  function sessionHasContent(s){
    if(!s) return false;
    if(s.finishedAt) return true;
    return (s.exercises || []).some(function(e){
      return e.done || (e.weight !== '' && e.weight != null) || e.minutes || e.custom || e.renamed;
    }) || !!s.switched;
  }

  /* Las sesiones que realmente cuentan: lo que se guarda, exporta y lista. */
  function recordedSessions(){
    var out = {};
    Object.keys(state.sessions).forEach(function(d){
      if(sessionHasContent(state.sessions[d])) out[d] = state.sessions[d];
    });
    return out;
  }

  function saveSessions(){ safeSet(LS_SESSIONS, JSON.stringify(recordedSessions())); }

  function loadUi(){
    var raw = safeGet(LS_UI);
    if(raw){ try{ return JSON.parse(raw); }catch(e){} }
    return {tab:'hoy', installDismissed:false};
  }
  function saveUi(){ safeSet(LS_UI, JSON.stringify(state.ui)); }

  /* ---------- export / import ----------
     Unica red de seguridad contra perder el historial: localStorage no sobrevive
     a un "borrar datos del sitio" ni a desinstalar la PWA. */
  var EXPORT_VERSION = 2;   // v1 guardaba series por ejercicio; se migra al importar

  function exportData(){
    var payload = {
      app: 'bitacora-entreno',
      version: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      template: state.template,
      sessions: recordedSessions()
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bitacora-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    state.ui.lastExport = Date.now();
    saveUi();
  }

  /* Sin recordatorio nadie exporta: se avisa si pasaron mas de BACKUP_STALE_DAYS
     desde el ultimo export y hay algo que perder. */
  var BACKUP_STALE_DAYS = 7;

  function backupIsStale(){
    if(Object.keys(recordedSessions()).length === 0) return false;
    var last = state.ui.lastExport;
    return !last || (Date.now() - last) > BACKUP_STALE_DAYS * 86400000;
  }

  function backupAgeText(){
    var last = state.ui.lastExport;
    if(!last) return 'Nunca exportaste una copia.';
    var days = Math.floor((Date.now() - last) / 86400000);
    if(days === 0) return 'Última copia: hoy.';
    return 'Última copia: hace ' + days + (days === 1 ? ' día.' : ' días.');
  }

  function wireExportButton(){
    viewEl.querySelectorAll('[data-action="exportData"]').forEach(function(exportBtn){
      exportBtn.addEventListener('click', function(){
        try{
          exportData();
          exportBtn.textContent = 'Archivo generado ✓';
        }catch(err){
          exportBtn.textContent = 'No se pudo exportar';
        }
        setTimeout(function(){ if(exportBtn.isConnected) exportBtn.textContent = 'Exportar a archivo'; }, 3000);
      });
    });
  }

  /* Valida lo justo para no pisar datos buenos con un archivo cualquiera. */
  function parseBackup(text){
    var data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('El archivo no tiene el formato esperado.');
    if(data.app && data.app !== 'bitacora-entreno') throw new Error('Ese archivo es de otra app.');
    if(typeof data.template !== 'object' || data.template === null) throw new Error('Al archivo le falta la plantilla.');
    if(typeof data.sessions !== 'object' || data.sessions === null) throw new Error('Al archivo le faltan las sesiones.');
    var hasDay = DAY_ORDER.some(function(k){
      return data.template[k] && Array.isArray(data.template[k].exercises);
    });
    if(!hasDay) throw new Error('La plantilla del archivo está vacía o corrupta.');
    return data;
  }

  function applyBackup(data){
    /* Un archivo v1 trae el formato viejo (array de series por ejercicio):
       se migra igual que lo guardado en localStorage. */
    state.template = migrateTemplate(data.template);
    state.sessions = migrateSessions(data.sessions);
    saveTemplate();
    saveSessions();
    state.historyOpenDate = null;
    render();
  }

  /* ---------- estado ---------- */
  /* ---------- diagnostico (?diag) ----------
     Solo lee. Va ANTES de inicializar el estado porque loadTemplate/loadSessions
     escriben (persisten la migracion), y eso taparia la evidencia de un problema. */
  if(/(^|[?&#])diag(=|&|$)/.test(location.search + location.hash)){
    (function(){
      var lineas = [];
      var total = 0;
      try{
        var claves = Object.keys(localStorage).sort();
        lineas.push('claves en total: ' + claves.length);
        claves.forEach(function(k){
          var v = localStorage.getItem(k) || '';
          total += v.length;
          var resumen = '';
          if(/sessions/.test(k)){
            try{
              var o = JSON.parse(v);
              var fechas = Object.keys(o).sort();
              resumen = fechas.length + ' sesiones: ' + (fechas.join(', ') || '(ninguna)');
              fechas.forEach(function(f){
                var ses = o[f] || {};
                var exs = (ses.exercises || []).map(function(e){
                  var d = e.kind === 'cardio' ? (e.minutes != null ? e.minutes + 'min' : '-')
                                              : (e.weight !== '' && e.weight != null ? e.weight + 'kg' : '-');
                  return e.name + '=' + d + (e.done ? '(ok)' : '');
                });
                resumen += '\n      ' + f + (ses.finishedAt ? ' [cerrado]' : ' [abierto]') + ': ' + (exs.join(', ') || 'sin ejercicios');
              });
            }catch(err){ resumen = 'NO PARSEA: ' + err.message; }
          } else if(/template_v/.test(k)){
            try{
              var t = JSON.parse(v);
              resumen = ['mon','tue','wed','thu','fri'].map(function(d){
                return d + '=' + ((t[d] && t[d].exercises) ? t[d].exercises.length : '?');
              }).join(' ');
              if(t.thu && t.thu.exercises && t.thu.exercises[0]) resumen += ' | jue[0]=' + t.thu.exercises[0].name;
            }catch(err){ resumen = 'NO PARSEA: ' + err.message; }
          } else {
            resumen = v.slice(0, 120);
          }
          lineas.push('\n' + k + '  (' + v.length + ' chars)\n  ' + resumen);
        });
        lineas.push('\ntotal guardado: ' + total + ' chars');
      }catch(err){
        lineas.push('ERROR leyendo localStorage: ' + err.message);
      }
      lineas.push('\nURL: ' + location.href);
      lineas.push('userAgent: ' + navigator.userAgent);

      var texto = lineas.join('\n');
      document.body.innerHTML =
        '<div style="padding:16px;font-family:monospace;font-size:12px;line-height:1.5;">' +
        '<h2 style="font-family:sans-serif;">Diagnóstico (solo lectura)</h2>' +
        '<button id="copiar" style="padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:12px;">Copiar todo</button>' +
        '<pre id="dump" style="white-space:pre-wrap;word-break:break-word;">' + escapeHtml(texto) + '</pre>' +
        '</div>';
      document.getElementById('copiar').addEventListener('click', function(){
        var btn = this;
        function ok(){ btn.textContent = 'Copiado ✓'; }
        try{
          navigator.clipboard.writeText(texto).then(ok, seleccionar);
        }catch(e){ seleccionar(); }
        function seleccionar(){
          var r = document.createRange();
          r.selectNodeContents(document.getElementById('dump'));
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          btn.textContent = 'Seleccionado: copiá a mano';
        }
      });
    })();
    return;   // no se arranca la app: no se escribe nada
  }

  var state = {
    template: loadTemplate(),
    sessions: loadSessions(),
    ui: loadUi(),
    historyOpenDate: null
  };

  /* localStorage es la unica copia: pedir que el navegador no la desaloje
     cuando se queda sin espacio. Si no lo concede, no cambia nada. */
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(function(){}); }catch(e){}

  /* ---------- sesiones ---------- */
  function cloneExercisesFromTemplate(dayKey){
    var day = state.template[dayKey];
    if(!day) return [];
    return day.exercises.map(function(e){
      if(e.kind === 'cardio'){
        return {name:e.name, kind:'cardio', options:(e.options||CARDIO_OPTIONS).slice(), minutes:null, done:false};
      }
      return {
        name: e.name, kind: 'strength',
        targetSets: e.targetSets || DEFAULT_SETS, targetReps: e.targetReps || DEFAULT_REPS,
        weight: '', done: false
      };
    });
  }

  function ensureSession(dateStr, dayKey){
    if(state.sessions[dateStr]) return state.sessions[dateStr];
    var focus = (state.template[dayKey] && state.template[dayKey].focus) || (DAY_LABEL[dayKey] || 'Entreno');
    var session = {
      date: dateStr, dayKey: dayKey, label: focus,
      finishedAt: null,
      exercises: dayKey ? cloneExercisesFromTemplate(dayKey) : []
    };
    state.sessions[dateStr] = session;
    saveSessions();
    return session;
  }

  function lastForExercise(name, beforeDate){
    /* Solo fechas anteriores: al abrir una sesion vieja desde el Historial, la
       referencia no puede venir de un dia posterior. */
    var dates = Object.keys(state.sessions).filter(function(d){ return d < beforeDate; }).sort().reverse();
    for(var i=0;i<dates.length;i++){
      var sess = state.sessions[dates[i]];
      var found = null;
      for(var j=0;j<sess.exercises.length;j++){
        if(sess.exercises[j].name === name){ found = sess.exercises[j]; break; }
      }
      if(found){
        if(found.kind === 'cardio'){
          if(found.minutes) return {date: dates[i], minutes: found.minutes};
        } else if(found.weight !== '' && found.weight != null){
          return {date: dates[i], weight: found.weight};
        }
      }
    }
    return null;
  }

  function setsSummary(session){
    var done = 0;
    session.exercises.forEach(function(e){ if(e.done) done++; });
    return {done: done, total: session.exercises.length};
  }

  /* ---------- render raíz ---------- */
  var viewEl = document.getElementById('view');
  var dateLabelEl = document.getElementById('dateLabel');
  var dayTitleEl = document.getElementById('dayTitle');
  var daySubEl = document.getElementById('daySub');

  function setTab(tab){
    state.ui.tab = tab; state.historyOpenDate = null; saveUi();
    render();
  }

  function render(){
    viewEl.classList.remove('split');
    document.querySelectorAll('.tab').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-tab') === state.ui.tab);
    });

    var now = today();
    var todayIso = isoDate(now);
    dateLabelEl.textContent = fmtDateLong(todayIso);

    if(state.ui.tab === 'hoy'){
      dayTitleEl.textContent = 'Hoy';
      var wk = weekdayKeyOf(now);
      var todaySession = state.sessions[todayIso];
      daySubEl.textContent = todaySession ? todaySession.label
        : (state.template[wk] ? state.template[wk].focus : 'Sin día programado');
      renderHoy(todayIso, wk);
    } else if(state.ui.tab === 'rutina'){
      dayTitleEl.textContent = 'Rutina';
      daySubEl.textContent = 'Plantilla semanal · lunes a viernes';
      renderRutina();
    } else {
      dayTitleEl.textContent = 'Historial';
      daySubEl.textContent = Object.keys(recordedSessions()).length + ' sesiones registradas';
      renderHistorial();
    }

    /* La entrada animada solo cuando cambia la pantalla, no en cada redibujo:
       si no, cargar un dato haria "rebotar" todo. */
    var viewKey = state.ui.tab + '|' + (state.historyOpenDate || '') + '|' + todayIso;
    viewEl.classList.remove('celebrate');
    if(state.justFinished){ viewEl.classList.add('celebrate'); state.justFinished = false; }
    if(viewKey !== lastViewKey){
      lastViewKey = viewKey;
      viewEl.classList.remove('enter');
      void viewEl.offsetWidth;   // reinicia la animacion
      viewEl.classList.add('enter');
      viewEl.scrollTop = 0;
      [dayTitleEl, daySubEl].forEach(function(el){
        el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
      });
    }
  }
  var lastViewKey = null;

  /* Un toque corto en Android al marcar algo: confirma sin mirar la pantalla. */
  function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

  function progressHtml(summary){
    var pct = summary.total ? Math.round(summary.done / summary.total * 100) : 0;
    return '<div class="progress' + (pct === 100 ? ' full' : '') + '" data-role="progress">' +
             '<span style="width:' + pct + '%"></span></div>';
  }

  /* Actualiza contador y barra sin redibujar la pantalla: un render completo
     cierra el teclado, mueve el scroll y corta las animaciones. */
  /* Terminar dia recien se habilita con algo cargado, y desde ahi ya no se
     ofrece "Hacer otro dia" (pisaria lo cargado). Va sin re-render. */
  function refreshDayControls(session){
    var has = sessionHasData(session);
    var finishBtn = viewEl.querySelector('[data-action="finishDay"]');
    if(finishBtn) finishBtn.disabled = !has;
    if(has){
      viewEl.querySelectorAll('[data-action="toggleSwitchDay"], [data-role="switchDays"]').forEach(function(el){
        var row = el.closest('.row') || el;
        row.remove();
      });
    }
  }

  function refreshProgress(session){
    refreshDayControls(session);
    var summary = setsSummary(session);
    var pill = viewEl.querySelector('[data-role="count"]');
    if(pill){
      pill.textContent = summary.done + '/' + summary.total + ' ejercicios';
      pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
    }
    var bar = viewEl.querySelector('[data-role="progress"]');
    if(bar){
      var pct = summary.total ? Math.round(summary.done / summary.total * 100) : 0;
      var wasFull = bar.classList.contains('full');
      bar.firstChild.style.width = pct + '%';
      bar.classList.toggle('full', pct === 100);
      bar.classList.remove('shine');
      if(pct === 100 && !wasFull){ void bar.offsetWidth; bar.classList.add('shine'); }
      var finishBtn = viewEl.querySelector('[data-action="finishDay"]');
      if(finishBtn) finishBtn.classList.toggle('ready', pct === 100);
    }
  }

  /* Acepta "62,5" o "62.5" y devuelve con el mismo separador que se venia usando. */
  function parseWeight(v){
    var n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
    return isNaN(n) ? null : n;
  }
  function formatWeight(n, like){
    var s = String(Math.round(n * 100) / 100);
    return /,/.test(String(like || '')) ? s.replace('.', ',') : s;
  }
  var WEIGHT_STEP = 1;

  /* ---------- banner de instalación ---------- */
  var deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    syncInstallPill();
    /* Solo redibujar si se ve el banner: un render cerraria el teclado. */
    if(state.ui.tab === 'hoy' && !state.ui.installDismissed && !isEditing()) render();
  });

  function isEditing(){
    var a = document.activeElement;
    return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
  }

  /* Boton fijo "Instalar" arriba: siempre a mano mientras la app corra en el
     navegador, aunque se haya cerrado el banner. Instalada, desaparece. */
  var installPill = document.getElementById('installPill');
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  function isInstalled(){
    try{ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
    catch(e){ return false; }
  }
  function syncInstallPill(){ installPill.hidden = isInstalled(); }

  installPill.addEventListener('click', function(){
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(function(){
        deferredInstallPrompt = null; syncInstallPill(); render();
      });
      return;
    }
    /* Sin el aviso nativo del navegador, mostrar como hacerlo a mano. */
    state.ui.installDismissed = false; saveUi();
    setTab('hoy');
    viewEl.scrollTop = 0;
  });
  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null; syncInstallPill();
  });
  syncInstallPill();

  function installBannerHtml(){
    if(state.ui.installDismissed || isInstalled()) return '';
    var text = deferredInstallPrompt
      ? 'Instalá la app para usarla como una app normal, offline y sin la barra del navegador.'
      : (isIOS
        ? 'Para instalarla: botón Compartir de Safari → "Agregar a inicio".'
        : 'Para instalarla: menú ⋮ de Chrome → "Agregar a pantalla de inicio" (o "Instalar app").');
    return (
      '<div class="install-banner">' +
        '<p>' + text + '</p>' +
        (deferredInstallPrompt ? '<button class="btn btn-primary small" data-action="doInstall">Instalar</button>' : '') +
        '<button class="icon-btn" data-action="dismissInstall" aria-label="Cerrar">✕</button>' +
      '</div>'
    );
  }

  /* El banner se dibuja en las dos ramas de renderHoy, asi que su wiring vive
     aparte: antes colgaba de wireSessionEditor y los fines de semana, que no
     lo llaman, los botones quedaban muertos. */
  function wireInstallBanner(){
    var dismissBtn = viewEl.querySelector('[data-action="dismissInstall"]');
    if(dismissBtn){
      dismissBtn.addEventListener('click', function(){
        state.ui.installDismissed = true; saveUi(); render();
      });
    }
    var installBtn = viewEl.querySelector('[data-action="doInstall"]');
    if(installBtn){
      installBtn.addEventListener('click', function(){
        if(!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.finally(function(){
          deferredInstallPrompt = null; render();
        });
      });
    }
  }

  /* Chips de "Fin de semana": solo existen en esa rama de renderHoy. */
  function wireWeekendChips(){
    viewEl.querySelectorAll('[data-action="startWeekend"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        var todayIso = isoDate(today());
        ensureSession(todayIso, day || null);
        render();
      });
    });
  }

  /* ---------- HOY / editor de sesión (reutilizado en historial) ---------- */
  function renderHoy(todayIso, wk){
    /* Basta con que la sesion exista en memoria: elegir un dia la crea aunque
       todavia no tenga nada cargado. Si se cierra la app sin tocar nada no se
       guarda, y al volver aparece otra vez esta eleccion. */
    if(!state.template[wk] && !state.sessions[todayIso]){
      viewEl.innerHTML =
        installBannerHtml() +
        '<div class="card stack">' +
          '<div>' +
            '<h2>Fin de semana</h2>' +
            '<p class="ex-target" style="margin-top:6px;">No tenés un día programado hoy. Si igual vas a entrenar, elegí de qué día partir o empezá en blanco.</p>' +
          '</div>' +
          '<div class="day-tabs">' +
            DAY_ORDER.map(function(k){ return '<button data-action="startWeekend" data-day="'+k+'">'+DAY_LABEL[k]+'</button>'; }).join('') +
            '<button data-action="startWeekend" data-day="">En blanco</button>' +
          '</div>' +
        '</div>';
      wireInstallBanner();
      wireWeekendChips();
      return;
    }
    var session = ensureSession(todayIso, wk);

    /* Con el dia terminado, el editor completo invitaba a seguir cargando como
       si nada. Se muestra el resumen cerrado, y para corregir hay que reabrir. */
    if(session.finishedAt){
      viewEl.innerHTML = installBannerHtml() + dayDoneHtml(session);
      wireInstallBanner();
      wireExportButton();
      var reopen = viewEl.querySelector('[data-action="reopenDay"]');
      if(reopen){
        reopen.addEventListener('click', function(){
          session.finishedAt = null;
          saveSessions(); render();
        });
      }
      return;
    }

    /* Si hoy no toca entrenar, la sesion salio de elegir un dia a mano: hay que
       poder volver a esa eleccion, o queda sin salida. */
    var offDay = !state.template[wk];
    viewEl.innerHTML = installBannerHtml() + sessionEditorHtml(session, true, offDay);
    wireSessionEditor(session, true);
  }

  function dayDoneHtml(session){
    var summary = setsSummary(session);
    var html = '';
    html += '<div class="card done-card">';
    html += '  <div class="done-mark">✓</div>';
    html += '  <h2>Entrenamiento hecho</h2>';
    html += '  <div class="ex-target">' + escapeHtml(session.label) + '</div>';
    html += '  <div class="done-count">' + summary.done + ' de ' + summary.total + ' ejercicios</div>';
    html += '</div>';

    html += '<div class="card">';
    session.exercises.forEach(function(e){
      var val = e.kind === 'cardio'
        ? (e.minutes ? e.minutes + ' min' : '—')
        : (e.weight !== '' && e.weight != null ? e.weight + ' kg' : '—');
      html += '<div class="done-row' + (e.done ? '' : ' skipped') + '">' +
                '<span class="done-name">' + (e.done ? '✓ ' : '· ') + escapeHtml(e.name) + '</span>' +
                '<span class="done-val">' + escapeHtml(String(val)) + '</span>' +
              '</div>';
    });
    html += '</div>';

    /* Cerrar el dia es el momento natural para acordarse del backup. */
    if(backupIsStale()){
      html += '<div class="card stack" style="text-align:center;">';
      html += '  <div class="ex-target">' + escapeHtml(backupAgeText()) + ' Conviene exportar una copia.</div>';
      html += '  <button class="btn btn-primary small" data-action="exportData">Exportar a archivo</button>';
      html += '</div>';
    }

    html += '<div class="card stack" style="text-align:center;">';
    html += '  <div class="ex-target">¿Te faltó cargar algo?</div>';
    html += '  <button class="btn btn-ghost small" data-action="reopenDay">Corregir el día</button>';
    html += '</div>';
    return html;
  }

  function sessionEditorHtml(session, isToday, offDay){
    var summary = setsSummary(session);

    /* No se mide cuanto duro el entreno: solo interesa si el dia esta cerrado. */
    var dayStatus = session.finishedAt
      ? '<span class="pill ok">Día terminado</span>' +
        '<button class="btn btn-ghost small" data-action="reopenDay">Reabrir</button>'
      : '<button class="btn btn-primary small'+(summary.total && summary.done === summary.total ? ' ready' : '')+'" data-action="finishDay"'+(sessionHasData(session) ? '' : ' disabled')+'>Terminar día</button>';

    var html = '';
    html += '<div class="card stack">';
    html += '  <div class="row">';
    html += '    <input class="field-inline" style="font-family:var(--font-display);font-size:18px;font-weight:600;border:none;background:none;color:var(--text);width:60%;" ' +
             'value="'+escapeHtml(session.label)+'" data-action="renameSession" placeholder="Enfoque del día">';
    html += '    <span class="pill" data-role="count">'+summary.done+'/'+summary.total+' ejercicios</span>';
    html += '  </div>';
    html += '  ' + progressHtml(summary);
    html += '  <div class="row">' + dayStatus + '</div>';
    if(offDay){
      html += '  <div class="row"><button class="btn btn-ghost small" data-action="changeDay">← Elegir otro día</button></div>';
    } else if(isToday && !session.finishedAt && !sessionHasData(session)){
      /* Cambiar la rutina de hoy por la de otro dia (p. ej. el miercoles hacer
         lo del jueves). Solo antes de cargar nada, para no pisar datos. */
      html += '  <div class="row"><button class="btn btn-ghost small" data-action="toggleSwitchDay">⇄ Hacer otro día</button></div>';
      html += '  <div class="day-tabs" data-role="switchDays" hidden>' +
               DAY_ORDER.filter(function(k){ return k !== session.dayKey; }).map(function(k){
                 return '<button data-action="switchDay" data-day="'+k+'">'+DAY_LABEL[k]+'</button>';
               }).join('') + '</div>';
    }
    html += '</div>';

    if(session.exercises.length === 0){
      /* Una sesion vacia antes era un callejon sin salida: ensureSession solo
         clona la plantilla al crearla, nunca despues. */
      var tplDay = session.dayKey && state.template[session.dayKey];
      html += '<div class="card stack" style="text-align:center;">';
      html += '  <div class="empty" style="padding:16px 10px 4px;">Este día quedó sin ejercicios.</div>';
      if(tplDay){
        html += '  <button class="btn btn-primary small" data-action="restoreFromTemplate">' +
                'Cargar los ejercicios del ' + (DAY_LABEL[session.dayKey]||'día').toLowerCase() + '</button>';
      } else {
        html += '  <div class="ex-target">Agregá uno abajo, o copiá los de otro día.</div>';
      }
      html += '</div>';
    }

    session.exercises.forEach(function(e, i){
      var last = lastForExercise(e.name, session.date);
      html += '<div class="card">';
      html += exerciseCardHtml(e, i, last);
      html += '</div>';
    });

    html += '<div class="card stack">';
    html += '  <div class="field"><label>Agregar ejercicio</label>' +
             '<div class="row" style="gap:6px;">' +
             '  <input type="text" id="newExName" placeholder="Nombre" style="flex:1;">' +
             '  <select id="newExKind" style="flex:none;width:110px;">' +
             '    <option value="strength">Fuerza</option>' +
             '    <option value="cardio">Cardio</option>' +
             '  </select>' +
             '</div></div>';
    html += '  <button class="btn btn-ghost small" data-action="addCustomExercise">+ Agregar ejercicio</button>';
    html += '  <div class="field"><label>Copiar ejercicios de otro día</label>' +
             '<div class="day-tabs">' +
             DAY_ORDER.map(function(k){ return '<button data-action="copyFromDay" data-day="'+k+'">'+DAY_LABEL[k]+'</button>'; }).join('') +
             '</div></div>';
    html += '</div>';

    return html;
  }

  function exerciseCardHtml(e, i, last){
    var isCardio = e.kind === 'cardio';
    var html = '';
    html += '<div class="ex-card '+(e.done?'done':'')+'" data-ex="'+i+'">';
    html += '  <div class="ex-head">';
    html += '    <div>';
    html += '      <div class="ex-name">'+escapeHtml(e.name)+'</div>';
    html += '      <div class="ex-target">'+(isCardio ? 'cardio' : e.targetSets+'×'+escapeHtml(e.targetReps))+'</div>';
    html += '    </div>';
    /* Los ejercicios que vienen de la rutina no se borran: un toque accidental
       no deberia costarte una tarjeta. Lo que agregaste vos ese dia, si. */
    html += '    <div class="ex-actions">';
    html += '      <button class="icon-btn" data-action="renameEx" data-ex="'+i+'" aria-label="Reemplazar ejercicio">✎</button>';
    if(e.custom){
      html += '      <button class="icon-btn danger" data-action="removeEx" data-ex="'+i+'" aria-label="Quitar ejercicio agregado">✕</button>';
    }
    html += '    </div>';
    html += '  </div>';

    if(last){
      var lastLabel = 'Última vez ('+fmtDateShort(last.date)+'): ';
      if(isCardio){
        html += '  <div class="ex-last">'+lastLabel+escapeHtml(String(last.minutes))+' min</div>';
      } else {
        /* Casi siempre se repite el peso anterior: un toque lo copia, sin teclado. */
        html += '  <button type="button" class="ex-last use-last" data-action="useLast" data-ex="'+i+'" data-w="'+escapeHtml(String(last.weight))+'">' +
                  '<span>Última: '+escapeHtml(String(last.weight))+' kg · '+fmtDateShort(last.date)+'</span><span class="use-tag">Repetir</span></button>';
      }
    }

    html += '  <div class="ex-main">';
    if(isCardio){
      html += '    <div class="cardio-opts">';
      (e.options || CARDIO_OPTIONS).forEach(function(min){
        html += '<button data-action="setMinutes" data-ex="'+i+'" data-min="'+min+'" class="'+(e.minutes === min ? 'active':'')+'">'+min+' min</button>';
      });
      html += '    </div>';
    } else {
      var placeholder = last ? String(last.weight) : '—';
      html += '    <div class="field"><label for="w-'+i+'">Peso máximo</label>' +
              '<div class="weight-row">' +
              '<button type="button" class="step-btn" data-action="stepWeight" data-ex="'+i+'" data-delta="-1" aria-label="Restar '+WEIGHT_STEP+' kg">−</button>' +
              '<input id="w-'+i+'" inputmode="decimal" enterkeyhint="done" autocomplete="off" class="num-input'+(last ? ' has-last' : '')+'" data-field="weight" data-ex="'+i+'" ' +
              'value="'+escapeHtml(e.weight || '')+'" placeholder="'+escapeHtml(placeholder)+'">' +
              '<button type="button" class="step-btn" data-action="stepWeight" data-ex="'+i+'" data-delta="1" aria-label="Sumar '+WEIGHT_STEP+' kg">+</button>' +
              '</div></div>';
    }
    html += '    <button class="check-btn '+(e.done?'on':'')+'" data-action="toggleExDone" data-ex="'+i+'" ' +
            'aria-label="Marcar ejercicio hecho">✓</button>';
    html += '  </div>';
    html += '</div>';
    return html;
  }

  function wireSessionEditor(session, isToday){
    /* El peso se guarda al vuelo, sin re-render: si redibujaramos aca el input
       perderia el foco mientras se escribe.
       Va en 'input' y no en 'change' porque change recien dispara al perder el
       foco: escribir el peso y bloquear la pantalla perdia el dato. */
    viewEl.querySelectorAll('input[data-field="weight"]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var exIdx = parseInt(inp.getAttribute('data-ex'),10);
        session.exercises[exIdx].weight = inp.value.trim();
        saveSessions();
        refreshDayControls(session);
      });
      // "Listo" en el teclado lo cierra
      inp.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); }
      });
    });

    function setWeight(exIdx, value){
      var inp = viewEl.querySelector('input[data-field="weight"][data-ex="'+exIdx+'"]');
      session.exercises[exIdx].weight = value;
      saveSessions();
      refreshDayControls(session);
      if(inp){
        inp.value = value;
        inp.classList.remove('flash'); void inp.offsetWidth; inp.classList.add('flash');
      }
      buzz(8);
    }

    viewEl.querySelectorAll('[data-action="useLast"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        setWeight(parseInt(btn.getAttribute('data-ex'),10), btn.getAttribute('data-w'));
      });
    });

    /* −/+ sin abrir el teclado. Si el campo esta vacio arranca del peso de la
       ultima vez, que es lo que muestra el placeholder. */
    viewEl.querySelectorAll('[data-action="stepWeight"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        var inp = viewEl.querySelector('input[data-field="weight"][data-ex="'+exIdx+'"]');
        var current = inp ? inp.value.trim() : session.exercises[exIdx].weight;
        var base = parseWeight(current);
        var like = current;
        if(base === null){
          base = parseWeight(inp && inp.placeholder);
          like = inp && inp.placeholder;
          if(base === null) base = 0;
        }
        var next = Math.max(0, base + parseInt(btn.getAttribute('data-delta'),10) * WEIGHT_STEP);
        setWeight(exIdx, formatWeight(next, like));
        if(inp){
          var cls = parseInt(btn.getAttribute('data-delta'),10) > 0 ? 'nudge-up' : 'nudge-down';
          inp.classList.remove('nudge-up', 'nudge-down'); void inp.offsetWidth; inp.classList.add(cls);
        }
      });
    });

    viewEl.querySelectorAll('[data-action="toggleExDone"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        var e = session.exercises[exIdx];
        /* Lo tipeado y todavia no confirmado se levanta del input por las dudas. */
        var weightInput = viewEl.querySelector('input[data-field="weight"][data-ex="'+exIdx+'"]');
        if(weightInput) e.weight = weightInput.value.trim();
        e.done = !e.done;
        /* El placeholder con el peso anterior se ve como un peso cargado, asi que
           tildar sin tocarlo tiene que guardarlo: si no, el historial quedaba sin peso. */
        if(e.done && weightInput && !e.weight && weightInput.classList.contains('has-last')){
          e.weight = weightInput.placeholder;
          weightInput.value = e.weight;
        }
        saveSessions();
        /* Sin render: se tocan solo la tarjeta y el progreso. */
        var card = viewEl.querySelector('.ex-card[data-ex="'+exIdx+'"]');
        if(card){
          card.classList.toggle('done', e.done);
          card.classList.remove('glow');
          if(e.done){ void card.offsetWidth; card.classList.add('glow'); }
        }
        btn.classList.toggle('on', e.done);
        btn.classList.remove('pop');
        if(e.done){ void btn.offsetWidth; btn.classList.add('pop'); buzz(20); }
        refreshProgress(session);
      });
    });

    viewEl.querySelectorAll('[data-action="setMinutes"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        var min = parseInt(btn.getAttribute('data-min'),10);
        var e = session.exercises[exIdx];
        e.minutes = (e.minutes === min) ? null : min;   // volver a tocar la opcion elegida la desmarca
        saveSessions();
        refreshDayControls(session);
        btn.parentNode.querySelectorAll('button').forEach(function(b){
          b.classList.toggle('active', parseInt(b.getAttribute('data-min'),10) === e.minutes);
        });
        buzz(8);
      });
    });

    /* Reemplazar = cambiar el nombre, solo para esta sesion. La plantilla no se
       toca: el proximo lunes vuelve el ejercicio original. */
    /* Descartar la sesion devuelve a la pantalla de eleccion. Si ya hay algo
       cargado, se pierde: por eso pide confirmacion. */
    var changeDayBtn = viewEl.querySelector('[data-action="changeDay"]');
    if(changeDayBtn){
      changeDayBtn.addEventListener('click', function(){
        var hasData = session.exercises.some(function(e){
          return e.done || (e.weight != null && e.weight !== '') || e.minutes;
        });
        if(hasData && changeDayBtn.dataset.armed !== '1'){
          changeDayBtn.dataset.armed = '1';
          changeDayBtn.textContent = 'Se pierde lo cargado. ¿Seguro?';
          changeDayBtn.classList.add('btn-danger');
          setTimeout(function(){
            if(!changeDayBtn.isConnected) return;
            changeDayBtn.dataset.armed = '0';
            changeDayBtn.textContent = '← Elegir otro día';
            changeDayBtn.classList.remove('btn-danger');
          }, 4000);
          return;
        }
        delete state.sessions[session.date];
        saveSessions(); render();
      });
    }

    var switchToggle = viewEl.querySelector('[data-action="toggleSwitchDay"]');
    if(switchToggle){
      switchToggle.addEventListener('click', function(){
        var row = viewEl.querySelector('[data-role="switchDays"]');
        if(row) row.hidden = !row.hidden;
      });
    }
    /* La sesion pasa a ser la de ese dia (ejercicios, enfoque y color en el
       Historial). `switched` la cuenta como registrada: si no, al cerrar la app
       sin cargar nada volveria a armarse con la rutina original. */
    viewEl.querySelectorAll('[data-action="switchDay"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        session.dayKey = day;
        session.label = (state.template[day] && state.template[day].focus) || DAY_LABEL[day];
        session.exercises = cloneExercisesFromTemplate(day);
        session.switched = true;
        saveSessions(); buzz(8); render();
      });
    });

    var restoreBtn = viewEl.querySelector('[data-action="restoreFromTemplate"]');
    if(restoreBtn){
      restoreBtn.addEventListener('click', function(){
        session.exercises = cloneExercisesFromTemplate(session.dayKey);
        saveSessions(); render();
      });
    }

    viewEl.querySelectorAll('[data-action="renameEx"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        var card = viewEl.querySelector('.ex-card[data-ex="'+exIdx+'"]');
        var nameEl = card && card.querySelector('.ex-name');
        if(!nameEl) return;

        var original = session.exercises[exIdx].name;
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'ex-rename';
        input.value = original;
        input.setAttribute('aria-label', 'Nombre del ejercicio');
        nameEl.parentNode.replaceChild(input, nameEl);
        input.focus();
        input.select();

        var settled = false;
        function commit(){
          if(settled) return;
          settled = true;
          var v = input.value.trim();
          if(v && v !== original){
            session.exercises[exIdx].name = v;
            /* Reemplazar es una decision del usuario: sin esta marca el dia se
               considera vacio y el cambio se perderia al recargar. */
            session.exercises[exIdx].renamed = true;
          }
          saveSessions(); render();
        }
        function cancel(){
          if(settled) return;
          settled = true;
          render();
        }
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ e.preventDefault(); commit(); }
          else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
        });
      });
    });

    viewEl.querySelectorAll('[data-action="removeEx"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        session.exercises.splice(exIdx,1);
        saveSessions(); render();
      });
    });

    var renameInput = viewEl.querySelector('[data-action="renameSession"]');
    if(renameInput){
      renameInput.addEventListener('change', function(){
        session.label = renameInput.value.trim() || session.label;
        saveSessions(); render();
      });
    }

    var finishDayBtn = viewEl.querySelector('[data-action="finishDay"]');
    if(finishDayBtn){
      finishDayBtn.addEventListener('click', function(){
        session.finishedAt = Date.now();
        state.justFinished = true;
        buzz([30, 60, 30]);
        saveSessions(); render();
      });
    }
    var reopenBtn = viewEl.querySelector('[data-action="reopenDay"]');
    if(reopenBtn){
      reopenBtn.addEventListener('click', function(){
        session.finishedAt = null;
        saveSessions(); render();
      });
    }

    var addCustomBtn = viewEl.querySelector('[data-action="addCustomExercise"]');
    if(addCustomBtn){
      addCustomBtn.addEventListener('click', function(){
        var name = document.getElementById('newExName').value.trim();
        if(!name) return;
        var kind = document.getElementById('newExKind').value;
        if(kind === 'cardio'){
          session.exercises.push({name:name, kind:'cardio', options:CARDIO_OPTIONS.slice(), minutes:null, done:false, custom:true});
        } else {
          session.exercises.push({
            name: name, kind: 'strength',
            targetSets: DEFAULT_SETS, targetReps: DEFAULT_REPS, weight: '', done: false, custom: true
          });
        }
        saveSessions(); render();
      });
    }

    viewEl.querySelectorAll('[data-action="copyFromDay"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        /* Copiados de otro dia: no son parte de la rutina de hoy, asi que se
           pueden sacar si fue un error. */
        var toAdd = cloneExercisesFromTemplate(day).map(function(e){ e.custom = true; return e; });
        session.exercises = session.exercises.concat(toAdd);
        saveSessions(); render();
      });
    });

    wireInstallBanner();
  }

    var resetBtn = viewEl.querySelector('[data-action="resetTemplate"]');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        if(resetBtn.dataset.armed === '1'){
          state.template = defaultTemplate();
          saveTemplate();
          safeSet(LS_TPLVER, String(TEMPLATE_VERSION));
          render();
        } else {
          resetBtn.dataset.armed = '1';
          resetBtn.textContent = '¿Seguro? Tocá de nuevo para confirmar';
          resetBtn.classList.add('btn-danger');
          setTimeout(function(){
            resetBtn.dataset.armed = '0';
            resetBtn.textContent = 'Restaurar plantilla por defecto';
            resetBtn.classList.remove('btn-danger');
          }, 4000);
        }
      });

    wireExportButton();

    /* Importar pisa todo lo que haya, asi que va con doble confirmacion:
       el primer toque abre el archivo, el segundo aplica. */
    var importBtn = viewEl.querySelector('[data-action="importData"]');
    var importInput = viewEl.querySelector('#importFile');
    if(importBtn && importInput){
      var pending = null;

      function resetImportBtn(){
        pending = null;
        importBtn.textContent = 'Importar desde archivo';
        importBtn.classList.remove('btn-danger');
      }

      importBtn.addEventListener('click', function(){
        if(pending){
          applyBackup(pending);
          return;
        }
        importInput.value = '';
        importInput.click();
      });

      importInput.addEventListener('change', function(){
        var file = importInput.files && importInput.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          try{
            var data = parseBackup(String(reader.result));
            var n = Object.keys(data.sessions).length;
            pending = data;
            importBtn.textContent = 'Reemplazar todo por ' + n + (n === 1 ? ' sesión' : ' sesiones') + '. ¿Seguro? Tocá de nuevo';
            importBtn.classList.add('btn-danger');
            setTimeout(function(){ if(pending) resetImportBtn(); }, 8000);
          }catch(err){
            pending = null;
            importBtn.textContent = err.message || 'Archivo inválido';
            setTimeout(resetImportBtn, 4000);
          }
        };
        reader.onerror = function(){
          importBtn.textContent = 'No se pudo leer el archivo';
          setTimeout(resetImportBtn, 4000);
        };
        reader.readAsText(file);
      });
    }
  }

  /* ---------- HISTORIAL ---------- */
  /* ---------- grafico de asistencia ----------
     Un dia cuenta como entrenado con un solo ejercicio registrado (tilde,
     peso o minutos). Lunes a viernes sin entrenar cuentan como faltas, pero
     solo desde la primera sesion: lo anterior no es falta, es que no se usaba
     la app. El fin de semana nunca es falta. */
  var HEAT_WEEKS = 16;
  var MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  function sessionTrained(s){
    return !!s && (s.exercises || []).some(function(e){
      return e.done || (e.weight !== '' && e.weight != null) || e.minutes;
    });
  }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  /* Racha en semanas, no en dias: siempre se descansa el finde y uno o dos
     dias habiles, asi que una racha diaria se cortaria todas las semanas.
     Una semana cuenta si tiene al menos STREAK_MIN_DAYS dias entrenados. La
     semana en curso suma si ya llego, y si todavia no, no corta. */
  var STREAK_MIN_DAYS = 3;

  function weekStreak(now, first){
    var monday = addDays(now, -((now.getDay() + 6) % 7));
    var streak = 0;
    for(var w = 0; w < 520; w++){
      var mon = addDays(monday, -7 * w);
      var sun = isoDate(addDays(mon, 6));
      if(sun < first) break;   // semana anterior al primer entreno
      var count = 0;
      for(var d = 0; d < 7; d++){
        if(sessionTrained(state.sessions[isoDate(addDays(mon, d))])) count++;
      }
      if(count >= STREAK_MIN_DAYS){ streak++; continue; }
      if(w === 0) continue;   // semana en curso: todavia puede llegar
      break;
    }
    return streak;
  }

  function historyChartHtml(){
    var now = today();
    var todayIso = isoDate(now);
    var trainedDates = Object.keys(state.sessions).filter(function(d){ return sessionTrained(state.sessions[d]); }).sort();
    var first = trainedDates[0] || todayIso;

    // lunes de la semana actual, y de ahi HEAT_WEEKS-1 semanas para atras
    var monday = addDays(now, -((now.getDay() + 6) % 7));
    var start = addDays(monday, -(HEAT_WEEKS - 1) * 7);

    var html = '<div class="heat" style="--weeks:'+HEAT_WEEKS+'">';
    html += '<span></span>';
    var prevMonth = -1;
    for(var w = 0; w < HEAT_WEEKS; w++){
      var wd = addDays(start, w * 7);
      html += '<span class="mlabel">'+(wd.getMonth() !== prevMonth ? MONTHS_SHORT[wd.getMonth()] : '')+'</span>';
      prevMonth = wd.getMonth();
    }
    // una fila por dia de la semana, una columna por semana
    var LETTERS = ['L','M','M','J','V','S','D'];
    for(var r = 0; r < 7; r++){
      html += '<span class="dlabel">'+LETTERS[r]+'</span>';
      for(var c = 0; c < HEAT_WEEKS; c++){
        var iso = isoDate(addDays(start, c * 7 + r));
        var sess = state.sessions[iso];
        var cls, extra = '', title = fmtDateShort(iso);
        if(iso > todayIso){ cls = 'future'; }
        else if(sessionTrained(sess)){
          cls = 'did'; extra = ' data-date="'+iso+'" data-day="'+escapeHtml(sess.dayKey || '')+'"';
          title += ' · ' + sess.label;
        }
        else if(r >= 5){ cls = 'rest'; }
        else if(iso === todayIso || iso < first){ cls = 'none'; }
        else { cls = 'miss'; title += ' · no entrenaste'; }
        if(iso === todayIso) cls += ' today';
        html += '<button type="button" class="cell '+cls+'"'+extra+' style="--c:'+c+'" aria-label="'+escapeHtml(title)+'"></button>';
      }
    }
    html += '</div>';

    // dias entrenados en las ultimas 4 semanas (sin denominador: el descanso
    // de entre semana es parte del plan, no una falta)
    var did = 0;
    for(var i = 0; i < 28; i++){
      if(sessionTrained(state.sessions[isoDate(addDays(now, -i))])) did++;
    }
    var streak = weekStreak(now, first);

    var stats = '<div class="heat-stats">' +
      '<div class="heat-stat"><b>'+did+'</b><span>días en 4 semanas</span></div>' +
      '<div class="heat-stat"><b>'+streak+'</b><span>'+(streak === 1 ? 'semana' : 'semanas')+' de racha</span></div>' +
      '<div class="heat-stat"><b>'+trainedDates.length+'</b><span>en total</span></div>' +
    '</div>';
    var legend = '<div class="heat-legend"><span><i class="l-did"></i>Entrené</span><span><i class="l-miss"></i>No fui</span></div>';
    return '<div class="card heat-card">' + stats + html + legend + '</div>';
  }

  /* ---------- navegación ---------- */
