<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bitácora de Entreno</title>
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --bg:#F4F5F8;
    --surface:#FFFFFF;
    --surface-2:#EAECF1;
    --text:#12151B;
    --text-muted:#5B6472;
    --border:#DBDFE6;
    --accent:#E85D3C;
    --accent-contrast:#FFFFFF;
    --ok:#2E9D63;
    --ok-bg:#E4F5EC;
    --gold:#B4872A;
    --gold-bg:#FAF1DD;
    --danger:#D14F4F;
    --shadow: 0 1px 2px rgba(18,21,27,.06), 0 8px 24px -12px rgba(18,21,27,.18);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1116;
      --surface:#171B22;
      --surface-2:#1F252E;
      --text:#EEF0F3;
      --text-muted:#9AA3B2;
      --border:#2A303A;
      --accent:#FF7A57;
      --accent-contrast:#171100;
      --ok:#49C58A;
      --ok-bg:#123024;
      --gold:#E3B84F;
      --gold-bg:#2E2611;
      --danger:#F27070;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1116;
    --surface:#171B22;
    --surface-2:#1F252E;
    --text:#EEF0F3;
    --text-muted:#9AA3B2;
    --border:#2A303A;
    --accent:#FF7A57;
    --accent-contrast:#171100;
    --ok:#49C58A;
    --ok-bg:#123024;
    --gold:#E3B84F;
    --gold-bg:#2E2611;
    --danger:#F27070;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  button, input{font-family:inherit; color:inherit;}
  input, select, .grid-4 > *{min-width:0;}
  input:focus-visible, button:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:.2px; text-wrap:balance; margin:0;}

  #app{display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; position:relative;}

  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top,0px)) 20px 10px;
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-muted);
  }
  .topbar h1{font-size:26px; margin-top:2px;}
  .topbar .sub{color:var(--text-muted); font-size:13.5px; margin-top:2px;}

  main#view{
    flex:1; overflow-y:auto; padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:14px;
  }

  .tabbar{
    position:sticky; bottom:0; z-index:5;
    display:flex; gap:4px;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:transparent; border:none; border-radius:12px; padding:8px 4px;
    font-size:12px; font-weight:700; color:var(--text-muted); cursor:pointer;
  }
  .tab .dot{width:6px; height:6px; border-radius:50%; background:transparent;}
  .tab.active{color:var(--accent);}
  .tab.active .dot{background:var(--accent);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:var(--shadow);
  }
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}

  .btn{
    appearance:none; border:none; border-radius:12px; padding:12px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-ghost{background:var(--surface-2); color:var(--text);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--border);}
  .btn.small{padding:8px 12px; font-size:13px; border-radius:10px;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.5;}

  .icon-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn.danger{color:var(--danger);}

  .pill{
    font-family:var(--font-mono); font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--text-muted);
  }
  .pill.ok{background:var(--ok-bg); color:var(--ok);}
  .pill.gold{background:var(--gold-bg); color:var(--gold);}

  .ex-card{border-top:1px solid var(--border); padding-top:14px;}
  .ex-card:first-child{border-top:none; padding-top:0;}
  .ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ex-name{font-weight:700; font-size:15.5px;}
  .ex-target{color:var(--text-muted); font-size:12.5px; margin-top:2px; font-family:var(--font-mono);}
  .ex-last{color:var(--text-muted); font-size:12.5px; margin-top:6px; background:var(--surface-2); padding:6px 10px; border-radius:8px; font-family:var(--font-mono);}

  .num-input{
    width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:10px; padding:11px 10px; font-family:var(--font-mono); font-size:17px; font-variant-numeric:tabular-nums;
    text-align:center;
  }

  /* Fila principal del ejercicio: el peso (o la duracion) y el tilde. */
  .ex-main{display:flex; align-items:flex-end; gap:10px; margin-top:10px;}
  .ex-main .field{flex:1;}
  .ex-card.done .num-input{border-color:var(--ok); background:var(--ok-bg);}
  .ex-card.done .ex-name{color:var(--text-muted); text-decoration:line-through;}

  .check-btn{
    width:52px; height:46px; flex:none; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-muted); font-size:20px; font-weight:700; cursor:pointer; opacity:.45;
  }
  .check-btn.on{opacity:1;}
  .check-btn.on{background:var(--ok); border-color:var(--ok); color:#fff;}

  /* Opciones de duracion del cardio. */
  .cardio-opts{display:flex; gap:6px; flex:1;}
  .cardio-opts button{
    flex:1; padding:12px 8px; border-radius:12px; border:1px solid var(--border); background:var(--bg);
    color:var(--text-muted); font-family:var(--font-mono); font-size:15px; font-weight:600; cursor:pointer;
  }
  .cardio-opts button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}

  .ghost-btn{
    margin-top:10px; background:none; border:1px dashed var(--border); color:var(--text-muted);
    border-radius:10px; padding:8px; font-size:13px; font-weight:700; cursor:pointer; width:100%;
  }

  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  input[type="text"], input[type="number"], input[type="search"], select{
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:10px; padding:8px 9px; font-size:13.5px; width:100%;
  }
  .grid-4{display:grid; grid-template-columns:1.7fr 0.8fr 0.9fr 0.8fr; gap:6px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  .empty{color:var(--text-muted); font-size:14px; text-align:center; padding:30px 10px;}

  .history-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 0; border-top:1px solid var(--border); cursor:pointer; background:none; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left;
  }
  .history-item:first-child{border-top:none;}
  .history-date{font-weight:700; font-size:14.5px;}
  .history-sub{color:var(--text-muted); font-size:12.5px; margin-top:2px;}

  .install-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px 14px; font-size:13px;
  }
  .install-banner p{margin:0; color:var(--text-muted); line-height:1.4;}
  .install-banner .icon-btn{flex:none;}

  .day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .day-tabs button{
    flex:none; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-muted); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .day-tabs button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
</style>

<div id="app">
  <header class="topbar">
    <div class="eyebrow" id="dateLabel">—</div>
    <h1 id="dayTitle">Bitácora</h1>
    <div class="sub" id="daySub"></div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="hoy"><span class="dot"></span>Hoy</button>
    <button class="tab" data-tab="rutina"><span class="dot"></span>Rutina</button>
    <button class="tab" data-tab="historial"><span class="dot"></span>Historial</button>
  </nav>

</div>

<script>
(function(){
  'use strict';

  /* ---------- constantes ---------- */
  var LS_TEMPLATE = 'bitacora_template_v1';
  var LS_SESSIONS = 'bitacora_sessions_v1';
  var LS_UI = 'bitacora_ui_v1';

  var DAY_ORDER = ['mon','tue','wed','thu','fri'];
  var DAY_LABEL = {mon:'Lunes',tue:'Martes',wed:'Miércoles',thu:'Jueves',fri:'Viernes',sat:'Sábado',sun:'Domingo'};
  var WEEKDAY_MAP = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri',6:'sat',0:'sun'};

  /* ---------- utilidades ---------- */
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function isoDate(d){ d = d || new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function weekdayKeyOf(d){ d = d || new Date(); return WEEKDAY_MAP[d.getDay()]; }
  function parseIso(dateStr){
    var p = dateStr.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function fmtDateLong(dateStr){
    var d = parseIso(dateStr);
    var opts = { weekday:'long', day:'numeric', month:'long' };
    var s = d.toLocaleDateString('es-AR', opts);
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function fmtDateShort(dateStr){
    var d = parseIso(dateStr);
    return d.toLocaleDateString('es-AR', {day:'numeric', month:'short'});
  }
  function fmtDuration(ms){
    var totalMin = Math.round(ms/60000);
    var h = Math.floor(totalMin/60), m = totalMin%60;
    if(h>0) return h+'h '+m+'min';
    return m+' min';
  }

  /* ---------- datos por defecto ---------- */
  /* Toda la rutina apunta a 4 series de 8-12; el cardio no usa series ni kg,
     solo una duracion que se elige en el momento. */
  var DEFAULT_SETS = 4, DEFAULT_REPS = '8-12', CARDIO_OPTIONS = [10, 15];

  function ex(name){ return {id:uid(), name:name, kind:'strength', targetSets:DEFAULT_SETS, targetReps:DEFAULT_REPS}; }
  function cardio(name){ return {id:uid(), name:name, kind:'cardio', options:CARDIO_OPTIONS.slice()}; }

  function defaultTemplate(){
    return {
      mon:{ focus:'Pecho / Tríceps', exercises:[
        ex('Pecho plano'),
        ex('Pecho aperturas'),
        ex('Tríceps con barra'),
        cardio('Cinta')
      ]},
      tue:{ focus:'Espalda / Bíceps', exercises:[
        ex('Jalón al pecho'),
        ex('Remo'),
        ex('Bíceps martillo'),
        ex('Bíceps supino')
      ]},
      wed:{ focus:'Piernas', exercises:[
        ex('Cuádricep'),
        ex('Isquio'),
        ex('Ad/abductores o prensa'),
        cardio('Cinta')
      ]},
      thu:{ focus:'Hombro / Tríceps', exercises:[
        ex('Press militar'),
        ex('Vuelos'),
        ex('Tríceps con cinta'),
        cardio('Cinta')
      ]},
      fri:{ focus:'Pecho / Espalda / Hombro / Bíceps', exercises:[
        ex('Pecho inclinado'),
        ex('Jalón al pecho'),
        ex('Press militar'),
        ex('Bíceps supino')
      ]}
    };
  }

  /* ---------- migracion de datos viejos ----------
     El formato anterior guardaba un array `sets` por ejercicio, con kg y reps
     por serie, y un `restSec` para el timer. Ahora es un peso por ejercicio y
     un tilde. Esto convierte lo que ya este en localStorage en vez de perderlo. */
  function migrateTemplateExercise(e){
    if(e.kind) return e;
    var isCardio = /cinta|caminata|bici|eliptic/i.test(e.name || '');
    var out = {id: e.id || uid(), name: e.name, kind: isCardio ? 'cardio' : 'strength'};
    if(isCardio){ out.options = CARDIO_OPTIONS.slice(); }
    else { out.targetSets = DEFAULT_SETS; out.targetReps = DEFAULT_REPS; }
    return out;
  }

  function migrateSessionExercise(e){
    if(e.kind && !e.sets) return e;
    var isCardio = e.kind === 'cardio' || /cinta|caminata|bici|eliptic/i.test(e.name || '');
    var out = {name: e.name, kind: isCardio ? 'cardio' : 'strength'};
    var sets = e.sets || [];
    out.done = sets.length > 0 && sets.every(function(s){ return s.done; });
    if(isCardio){
      out.options = e.options || CARDIO_OPTIONS.slice();
      out.minutes = e.minutes != null ? e.minutes : null;
    } else {
      out.targetSets = e.targetSets || DEFAULT_SETS;
      out.targetReps = e.targetReps || DEFAULT_REPS;
      // el peso del ejercicio es el ultimo que se haya anotado en alguna serie
      var weights = sets.map(function(s){ return s.weight; }).filter(function(w){ return w !== '' && w != null; });
      out.weight = e.weight != null ? e.weight : (weights.length ? weights[weights.length-1] : '');
    }
    return out;
  }

  function migrateTemplate(t){
    DAY_ORDER.forEach(function(k){
      if(t[k] && Array.isArray(t[k].exercises)) t[k].exercises = t[k].exercises.map(migrateTemplateExercise);
    });
    return t;
  }

  function migrateSessions(all){
    Object.keys(all).forEach(function(d){
      var sess = all[d];
      if(sess && Array.isArray(sess.exercises)) sess.exercises = sess.exercises.map(migrateSessionExercise);
    });
    return all;
  }

  /* ---------- persistencia ---------- */
  function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function safeSet(key, val){ try{ localStorage.setItem(key, val); return true; }catch(e){ return false; } }

  function loadTemplate(){
    var raw = safeGet(LS_TEMPLATE);
    if(raw){ try{
      var t = migrateTemplate(JSON.parse(raw));
      safeSet(LS_TEMPLATE, JSON.stringify(t));   // persistir la migracion, no solo aplicarla en memoria
      return t;
    }catch(e){} }
    var t = defaultTemplate();
    safeSet(LS_TEMPLATE, JSON.stringify(t));
    return t;
  }
  function saveTemplate(){ safeSet(LS_TEMPLATE, JSON.stringify(state.template)); }

  function loadSessions(){
    var raw = safeGet(LS_SESSIONS);
    if(raw){ try{
      var all = migrateSessions(JSON.parse(raw));
      safeSet(LS_SESSIONS, JSON.stringify(all));
      return all;
    }catch(e){} }
    return {};
  }
  function saveSessions(){ safeSet(LS_SESSIONS, JSON.stringify(state.sessions)); }

  function loadUi(){
    var raw = safeGet(LS_UI);
    if(raw){ try{ return JSON.parse(raw); }catch(e){} }
    return {tab:'hoy', installDismissed:false};
  }
  function saveUi(){ safeSet(LS_UI, JSON.stringify(state.ui)); }

  /* ---------- export / import ----------
     Unica red de seguridad contra perder el historial: localStorage no sobrevive
     a un "borrar datos del sitio" ni a desinstalar la PWA. */
  var EXPORT_VERSION = 2;   // v1 guardaba series por ejercicio; se migra al importar

  function exportData(){
    var payload = {
      app: 'bitacora-entreno',
      version: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      template: state.template,
      sessions: state.sessions
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bitacora-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  /* Valida lo justo para no pisar datos buenos con un archivo cualquiera. */
  function parseBackup(text){
    var data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('El archivo no tiene el formato esperado.');
    if(data.app && data.app !== 'bitacora-entreno') throw new Error('Ese archivo es de otra app.');
    if(typeof data.template !== 'object' || data.template === null) throw new Error('Al archivo le falta la plantilla.');
    if(typeof data.sessions !== 'object' || data.sessions === null) throw new Error('Al archivo le faltan las sesiones.');
    var hasDay = DAY_ORDER.some(function(k){
      return data.template[k] && Array.isArray(data.template[k].exercises);
    });
    if(!hasDay) throw new Error('La plantilla del archivo está vacía o corrupta.');
    return data;
  }

  function applyBackup(data){
    /* Un archivo v1 trae el formato viejo (array de series por ejercicio):
       se migra igual que lo guardado en localStorage. */
    state.template = migrateTemplate(data.template);
    state.sessions = migrateSessions(data.sessions);
    saveTemplate();
    saveSessions();
    state.historyOpenDate = null;
    render();
  }

  /* ---------- estado ---------- */
  var state = {
    template: loadTemplate(),
    sessions: loadSessions(),
    ui: loadUi(),
    historyOpenDate: null,
    liveInterval: null
  };

  /* ---------- sesiones ---------- */
  function cloneExercisesFromTemplate(dayKey){
    var day = state.template[dayKey];
    if(!day) return [];
    return day.exercises.map(function(e){
      if(e.kind === 'cardio'){
        return {name:e.name, kind:'cardio', options:(e.options||CARDIO_OPTIONS).slice(), minutes:null, done:false};
      }
      return {
        name: e.name, kind: 'strength',
        targetSets: e.targetSets || DEFAULT_SETS, targetReps: e.targetReps || DEFAULT_REPS,
        weight: '', done: false
      };
    });
  }

  function ensureSession(dateStr, dayKey){
    if(state.sessions[dateStr]) return state.sessions[dateStr];
    var focus = (state.template[dayKey] && state.template[dayKey].focus) || (DAY_LABEL[dayKey] || 'Entreno');
    var session = {
      date: dateStr, dayKey: dayKey, label: focus,
      startedAt: null, finishedAt: null,
      exercises: dayKey ? cloneExercisesFromTemplate(dayKey) : []
    };
    state.sessions[dateStr] = session;
    saveSessions();
    return session;
  }

  function lastForExercise(name, beforeDate){
    var dates = Object.keys(state.sessions).filter(function(d){ return d !== beforeDate; }).sort().reverse();
    for(var i=0;i<dates.length;i++){
      var sess = state.sessions[dates[i]];
      var found = null;
      for(var j=0;j<sess.exercises.length;j++){
        if(sess.exercises[j].name === name){ found = sess.exercises[j]; break; }
      }
      if(found){
        if(found.kind === 'cardio'){
          if(found.minutes) return {date: dates[i], minutes: found.minutes};
        } else if(found.weight !== '' && found.weight != null){
          return {date: dates[i], weight: found.weight};
        }
      }
    }
    return null;
  }

  function setsSummary(session){
    var done = 0;
    session.exercises.forEach(function(e){ if(e.done) done++; });
    return {done: done, total: session.exercises.length};
  }

  /* ---------- render raíz ---------- */
  var viewEl = document.getElementById('view');
  var dateLabelEl = document.getElementById('dateLabel');
  var dayTitleEl = document.getElementById('dayTitle');
  var daySubEl = document.getElementById('daySub');

  function setTab(tab){
    state.ui.tab = tab; state.historyOpenDate = null; saveUi();
    render();
  }

  function render(){
    document.querySelectorAll('.tab').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-tab') === state.ui.tab);
    });

    var now = new Date();
    var todayIso = isoDate(now);
    dateLabelEl.textContent = fmtDateLong(todayIso);

    if(state.ui.tab === 'hoy'){
      dayTitleEl.textContent = 'Hoy';
      var wk = weekdayKeyOf(now);
      daySubEl.textContent = state.template[wk] ? state.template[wk].focus : 'Sin día programado';
      renderHoy(todayIso, wk);
    } else if(state.ui.tab === 'rutina'){
      dayTitleEl.textContent = 'Rutina';
      daySubEl.textContent = 'Plantilla semanal · lunes a viernes';
      renderRutina();
    } else {
      dayTitleEl.textContent = 'Historial';
      daySubEl.textContent = Object.keys(state.sessions).length + ' sesiones registradas';
      renderHistorial();
    }
  }

  /* ---------- banner de instalación ---------- */
  var deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    render();
  });

  function installBannerHtml(){
    if(state.ui.installDismissed) return '';
    var text = deferredInstallPrompt
      ? 'Instalá la app para usarla como una app normal, offline y sin la barra del navegador.'
      : 'Para usarla como app: menú ⋮ de Chrome → "Agregar a pantalla de inicio".';
    return (
      '<div class="install-banner">' +
        '<p>' + text + '</p>' +
        (deferredInstallPrompt ? '<button class="btn btn-primary small" data-action="doInstall">Instalar</button>' : '') +
        '<button class="icon-btn" data-action="dismissInstall" aria-label="Cerrar">✕</button>' +
      '</div>'
    );
  }

  /* El banner se dibuja en las dos ramas de renderHoy, asi que su wiring vive
     aparte: antes colgaba de wireSessionEditor y los fines de semana, que no
     lo llaman, los botones quedaban muertos. */
  function wireInstallBanner(){
    var dismissBtn = viewEl.querySelector('[data-action="dismissInstall"]');
    if(dismissBtn){
      dismissBtn.addEventListener('click', function(){
        state.ui.installDismissed = true; saveUi(); render();
      });
    }
    var installBtn = viewEl.querySelector('[data-action="doInstall"]');
    if(installBtn){
      installBtn.addEventListener('click', function(){
        if(!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.finally(function(){
          deferredInstallPrompt = null; render();
        });
      });
    }
  }

  /* Chips de "Fin de semana": solo existen en esa rama de renderHoy. */
  function wireWeekendChips(){
    viewEl.querySelectorAll('[data-action="startWeekend"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        var todayIso = isoDate(new Date());
        ensureSession(todayIso, day || null);
        render();
      });
    });
  }

  /* ---------- HOY / editor de sesión (reutilizado en historial) ---------- */
  function renderHoy(todayIso, wk){
    if(!state.template[wk] && !state.sessions[todayIso]){
      viewEl.innerHTML =
        installBannerHtml() +
        '<div class="card stack">' +
          '<div>' +
            '<h2>Fin de semana</h2>' +
            '<p class="ex-target" style="margin-top:6px;">No tenés un día programado hoy. Si igual vas a entrenar, elegí de qué día partir o empezá en blanco.</p>' +
          '</div>' +
          '<div class="day-tabs">' +
            DAY_ORDER.map(function(k){ return '<button data-action="startWeekend" data-day="'+k+'">'+DAY_LABEL[k]+'</button>'; }).join('') +
            '<button data-action="startWeekend" data-day="">En blanco</button>' +
          '</div>' +
        '</div>';
      wireInstallBanner();
      wireWeekendChips();
      return;
    }
    var session = ensureSession(todayIso, wk);
    viewEl.innerHTML = installBannerHtml() + sessionEditorHtml(session, true);
    wireSessionEditor(session, true);
  }

  function sessionEditorHtml(session, isToday){
    var summary = setsSummary(session);
    var durationHtml = '';
    if(session.startedAt && !session.finishedAt){
      durationHtml = '<span class="pill" id="liveClock">'+fmtDuration(Date.now()-session.startedAt)+'</span>';
    } else if(session.finishedAt){
      durationHtml = '<span class="pill ok">'+fmtDuration(session.finishedAt-session.startedAt)+'</span>';
    }

    var startStopBtn = '';
    if(!session.startedAt){
      startStopBtn = '<button class="btn btn-primary small" data-action="startSession">▶ Iniciar sesión</button>';
    } else if(!session.finishedAt){
      startStopBtn = '<button class="btn btn-ghost small" data-action="finishSession">■ Finalizar</button>';
    }

    var html = '';
    html += '<div class="card stack">';
    html += '  <div class="row">';
    html += '    <input class="field-inline" style="font-family:var(--font-display);font-size:18px;font-weight:600;border:none;background:none;color:var(--text);width:60%;" ' +
             'value="'+escapeHtml(session.label)+'" data-action="renameSession" placeholder="Enfoque del día">';
    html += '    <span class="pill">'+summary.done+'/'+summary.total+' ejercicios</span>';
    html += '  </div>';
    html += '  <div class="row">' + startStopBtn + durationHtml + '</div>';
    html += '</div>';

    if(session.exercises.length === 0){
      html += '<div class="card empty">Todavía no hay ejercicios cargados para '+(isToday?'hoy':'este día')+'.</div>';
    }

    session.exercises.forEach(function(e, i){
      var last = lastForExercise(e.name, session.date);
      html += '<div class="card">';
      html += exerciseCardHtml(e, i, last);
      html += '</div>';
    });

    html += '<div class="card stack">';
    html += '  <div class="field"><label>Agregar ejercicio</label>' +
             '<div class="row" style="gap:6px;">' +
             '  <input type="text" id="newExName" placeholder="Nombre" style="flex:1;">' +
             '  <select id="newExKind" style="flex:none;width:110px;">' +
             '    <option value="strength">Fuerza</option>' +
             '    <option value="cardio">Cardio</option>' +
             '  </select>' +
             '</div></div>';
    html += '  <button class="btn btn-ghost small" data-action="addCustomExercise">+ Agregar ejercicio</button>';
    html += '  <div class="field"><label>Copiar ejercicios de otro día</label>' +
             '<div class="day-tabs">' +
             DAY_ORDER.map(function(k){ return '<button data-action="copyFromDay" data-day="'+k+'">'+DAY_LABEL[k]+'</button>'; }).join('') +
             '</div></div>';
    html += '</div>';

    return html;
  }

  function exerciseCardHtml(e, i, last){
    var isCardio = e.kind === 'cardio';
    var html = '';
    html += '<div class="ex-card '+(e.done?'done':'')+'" data-ex="'+i+'">';
    html += '  <div class="ex-head">';
    html += '    <div>';
    html += '      <div class="ex-name">'+escapeHtml(e.name)+'</div>';
    html += '      <div class="ex-target">'+(isCardio ? 'cardio' : e.targetSets+'×'+escapeHtml(e.targetReps))+'</div>';
    html += '    </div>';
    html += '    <button class="icon-btn danger" data-action="removeEx" data-ex="'+i+'" aria-label="Quitar ejercicio">✕</button>';
    html += '  </div>';

    if(last){
      var lastTxt = isCardio ? (last.minutes + ' min') : (last.weight + ' kg');
      html += '  <div class="ex-last">Última vez ('+fmtDateShort(last.date)+'): '+escapeHtml(String(lastTxt))+'</div>';
    }

    html += '  <div class="ex-main">';
    if(isCardio){
      html += '    <div class="cardio-opts">';
      (e.options || CARDIO_OPTIONS).forEach(function(min){
        html += '<button data-action="setMinutes" data-ex="'+i+'" data-min="'+min+'" class="'+(e.minutes === min ? 'active':'')+'">'+min+' min</button>';
      });
      html += '    </div>';
    } else {
      var placeholder = last ? String(last.weight) : '—';
      html += '    <div class="field"><label>Kg</label>' +
              '<input inputmode="decimal" class="num-input" data-field="weight" data-ex="'+i+'" ' +
              'value="'+escapeHtml(e.weight || '')+'" placeholder="'+escapeHtml(placeholder)+'"></div>';
    }
    html += '    <button class="check-btn '+(e.done?'on':'')+'" data-action="toggleExDone" data-ex="'+i+'" ' +
            'aria-label="Marcar ejercicio hecho">✓</button>';
    html += '  </div>';
    html += '</div>';
    return html;
  }

  function wireSessionEditor(session, isToday){
    /* El peso se guarda al vuelo, sin re-render: si redibujaramos aca el input
       perderia el foco mientras se escribe. */
    viewEl.querySelectorAll('input[data-field="weight"]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var exIdx = parseInt(inp.getAttribute('data-ex'),10);
        session.exercises[exIdx].weight = inp.value.trim();
        saveSessions();
      });
    });

    viewEl.querySelectorAll('[data-action="toggleExDone"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        var e = session.exercises[exIdx];
        /* Lo tipeado y todavia no confirmado se perderia en el render, asi que
           se levanta del input antes de redibujar. */
        var weightInput = viewEl.querySelector('input[data-field="weight"][data-ex="'+exIdx+'"]');
        if(weightInput) e.weight = weightInput.value.trim();
        e.done = !e.done;
        saveSessions(); render();
      });
    });

    viewEl.querySelectorAll('[data-action="setMinutes"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        var min = parseInt(btn.getAttribute('data-min'),10);
        var e = session.exercises[exIdx];
        e.minutes = (e.minutes === min) ? null : min;   // volver a tocar la opcion elegida la desmarca
        saveSessions(); render();
      });
    });

    viewEl.querySelectorAll('[data-action="removeEx"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var exIdx = parseInt(btn.getAttribute('data-ex'),10);
        session.exercises.splice(exIdx,1);
        saveSessions(); render();
      });
    });

    var renameInput = viewEl.querySelector('[data-action="renameSession"]');
    if(renameInput){
      renameInput.addEventListener('change', function(){
        session.label = renameInput.value.trim() || session.label;
        saveSessions(); render();
      });
    }

    var startBtn = viewEl.querySelector('[data-action="startSession"]');
    if(startBtn){
      startBtn.addEventListener('click', function(){
        session.startedAt = Date.now();
        saveSessions(); render();
      });
    }
    var finishBtn = viewEl.querySelector('[data-action="finishSession"]');
    if(finishBtn){
      finishBtn.addEventListener('click', function(){
        session.finishedAt = Date.now();
        saveSessions(); render();
      });
    }

    var addCustomBtn = viewEl.querySelector('[data-action="addCustomExercise"]');
    if(addCustomBtn){
      addCustomBtn.addEventListener('click', function(){
        var name = document.getElementById('newExName').value.trim();
        if(!name) return;
        var kind = document.getElementById('newExKind').value;
        if(kind === 'cardio'){
          session.exercises.push({name:name, kind:'cardio', options:CARDIO_OPTIONS.slice(), minutes:null, done:false});
        } else {
          session.exercises.push({
            name: name, kind: 'strength',
            targetSets: DEFAULT_SETS, targetReps: DEFAULT_REPS, weight: '', done: false
          });
        }
        saveSessions(); render();
      });
    }

    viewEl.querySelectorAll('[data-action="copyFromDay"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        var toAdd = cloneExercisesFromTemplate(day);
        session.exercises = session.exercises.concat(toAdd);
        saveSessions(); render();
      });
    });

    wireInstallBanner();

    if(session.startedAt && !session.finishedAt){
      clearInterval(state.liveInterval);
      state.liveInterval = setInterval(function(){
        var el = document.getElementById('liveClock');
        if(el) el.textContent = fmtDuration(Date.now()-session.startedAt);
      }, 1000);
    } else {
      clearInterval(state.liveInterval);
    }
  }

  /* ---------- RUTINA ---------- */
  function renderRutina(){
    var nSessions = Object.keys(state.sessions).length;
    var html = '<div class="card stack">' +
      '<p class="ex-target">Esta plantilla se usa para armar automáticamente el día de "Hoy". Cambiarla no modifica sesiones ya registradas.</p>' +
      '<button class="btn btn-ghost small" id="resetTplBtn" data-action="resetTemplate">Restaurar plantilla por defecto</button>' +
    '</div>';
    html += '<div class="card stack">' +
      '<div class="row"><h3>Copia de seguridad</h3></div>' +
      '<p class="ex-target">Los datos viven solo en este navegador: si borrás los datos del sitio o desinstalás la app, se pierden. ' +
        'Exportá de vez en cuando y guardate el archivo.</p>' +
      '<p class="ex-target"><strong>' + nSessions + '</strong> ' + (nSessions === 1 ? 'sesión guardada' : 'sesiones guardadas') + '.</p>' +
      '<button class="btn btn-ghost small" data-action="exportData">Exportar a archivo</button>' +
      '<button class="btn btn-ghost small" data-action="importData">Importar desde archivo</button>' +
      '<input type="file" id="importFile" accept="application/json,.json" hidden>' +
    '</div>';
    DAY_ORDER.forEach(function(dayKey){
      var day = state.template[dayKey];
      html += '<div class="card stack" data-day="'+dayKey+'">';
      html += '  <div class="row"><h3>'+DAY_LABEL[dayKey]+'</h3></div>';
      html += '  <div class="field"><label>Enfoque</label><input type="text" data-tpl-focus data-day="'+dayKey+'" value="'+escapeHtml(day.focus)+'"></div>';
      day.exercises.forEach(function(e, i){
        html += '  <div class="ex-card">';
        html += '    <div class="row" style="align-items:center; gap:8px;">';
        html += '      <input type="text" style="flex:1;" data-tpl-field="name" data-day="'+dayKey+'" data-ex="'+i+'" value="'+escapeHtml(e.name)+'" placeholder="Ejercicio">';
        html += '      <button class="icon-btn danger" data-tpl-remove data-day="'+dayKey+'" data-ex="'+i+'" aria-label="Quitar">✕</button>';
        html += '    </div>';
        var kindSelect = '<div class="field"><label>Tipo</label>' +
              '<select data-tpl-kind data-day="'+dayKey+'" data-ex="'+i+'">' +
              '  <option value="strength"'+(e.kind !== 'cardio' ? ' selected' : '')+'>Fuerza</option>' +
              '  <option value="cardio"'+(e.kind === 'cardio' ? ' selected' : '')+'>Cardio</option>' +
              '</select></div>';
        if(e.kind === 'cardio'){
          html += '    <div class="grid-2" style="margin-top:8px;">';
          html += kindSelect;
          html += '      <div class="field"><label>Duración</label>' +
                  '<div class="ex-target" style="padding-top:11px;">'+(e.options||CARDIO_OPTIONS).join(' o ')+' min</div></div>';
          html += '    </div>';
        } else {
          html += '    <div class="grid-3" style="margin-top:8px;">';
          html += kindSelect;
          html += '      <div class="field"><label>Series</label><input type="number" data-tpl-field="targetSets" data-day="'+dayKey+'" data-ex="'+i+'" value="'+e.targetSets+'"></div>';
          html += '      <div class="field"><label>Reps</label><input type="text" data-tpl-field="targetReps" data-day="'+dayKey+'" data-ex="'+i+'" value="'+escapeHtml(e.targetReps)+'"></div>';
          html += '    </div>';
        }
        html += '  </div>';
      });
      html += '  <button class="ghost-btn" data-tpl-add data-day="'+dayKey+'">+ Ejercicio</button>';
      html += '</div>';
    });
    viewEl.innerHTML = html;

    viewEl.querySelectorAll('[data-tpl-focus]').forEach(function(inp){
      inp.addEventListener('change', function(){
        state.template[inp.getAttribute('data-day')].focus = inp.value.trim();
        saveTemplate(); render();
      });
    });
    viewEl.querySelectorAll('[data-tpl-field]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var day = inp.getAttribute('data-day');
        var idx = parseInt(inp.getAttribute('data-ex'),10);
        var field = inp.getAttribute('data-tpl-field');
        var val = inp.value;
        if(field === 'targetSets') val = parseInt(val,10) || 0;
        state.template[day].exercises[idx][field] = val;
        saveTemplate();
      });
    });
    viewEl.querySelectorAll('[data-tpl-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        var idx = parseInt(btn.getAttribute('data-ex'),10);
        state.template[day].exercises.splice(idx,1);
        saveTemplate(); render();
      });
    });
    viewEl.querySelectorAll('[data-tpl-kind]').forEach(function(sel){
      sel.addEventListener('change', function(){
        var day = sel.getAttribute('data-day');
        var idx = parseInt(sel.getAttribute('data-ex'),10);
        var e = state.template[day].exercises[idx];
        /* Cambiar de tipo cambia que campos tiene el ejercicio, no solo una etiqueta. */
        if(sel.value === 'cardio'){
          state.template[day].exercises[idx] = {id:e.id||uid(), name:e.name, kind:'cardio', options:CARDIO_OPTIONS.slice()};
        } else {
          state.template[day].exercises[idx] = {id:e.id||uid(), name:e.name, kind:'strength', targetSets:DEFAULT_SETS, targetReps:DEFAULT_REPS};
        }
        saveTemplate(); render();
      });
    });

    viewEl.querySelectorAll('[data-tpl-add]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        state.template[day].exercises.push(ex('Nuevo ejercicio'));
        saveTemplate(); render();
      });
    });

    var resetBtn = viewEl.querySelector('[data-action="resetTemplate"]');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        if(resetBtn.dataset.armed === '1'){
          state.template = defaultTemplate();
          saveTemplate(); render();
        } else {
          resetBtn.dataset.armed = '1';
          resetBtn.textContent = '¿Seguro? Tocá de nuevo para confirmar';
          resetBtn.classList.add('btn-danger');
          setTimeout(function(){
            resetBtn.dataset.armed = '0';
            resetBtn.textContent = 'Restaurar plantilla por defecto';
            resetBtn.classList.remove('btn-danger');
          }, 4000);
        }
      });
    }

    var exportBtn = viewEl.querySelector('[data-action="exportData"]');
    if(exportBtn){
      exportBtn.addEventListener('click', function(){
        try{
          exportData();
          exportBtn.textContent = 'Archivo generado ✓';
        }catch(err){
          exportBtn.textContent = 'No se pudo exportar';
        }
        setTimeout(function(){ exportBtn.textContent = 'Exportar a archivo'; }, 3000);
      });
    }

    /* Importar pisa todo lo que haya, asi que va con doble confirmacion:
       el primer toque abre el archivo, el segundo aplica. */
    var importBtn = viewEl.querySelector('[data-action="importData"]');
    var importInput = viewEl.querySelector('#importFile');
    if(importBtn && importInput){
      var pending = null;

      function resetImportBtn(){
        pending = null;
        importBtn.textContent = 'Importar desde archivo';
        importBtn.classList.remove('btn-danger');
      }

      importBtn.addEventListener('click', function(){
        if(pending){
          applyBackup(pending);
          return;
        }
        importInput.value = '';
        importInput.click();
      });

      importInput.addEventListener('change', function(){
        var file = importInput.files && importInput.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          try{
            var data = parseBackup(String(reader.result));
            var n = Object.keys(data.sessions).length;
            pending = data;
            importBtn.textContent = 'Reemplazar todo por ' + n + (n === 1 ? ' sesión' : ' sesiones') + '. ¿Seguro? Tocá de nuevo';
            importBtn.classList.add('btn-danger');
            setTimeout(function(){ if(pending) resetImportBtn(); }, 8000);
          }catch(err){
            pending = null;
            importBtn.textContent = err.message || 'Archivo inválido';
            setTimeout(resetImportBtn, 4000);
          }
        };
        reader.onerror = function(){
          importBtn.textContent = 'No se pudo leer el archivo';
          setTimeout(resetImportBtn, 4000);
        };
        reader.readAsText(file);
      });
    }
  }

  /* ---------- HISTORIAL ---------- */
  function renderHistorial(){
    if(state.historyOpenDate){
      var session = state.sessions[state.historyOpenDate];
      var html = '<button class="btn btn-ghost small" data-action="backToList">← Volver al historial</button>';
      html += '<div class="eyebrow" style="margin-top:4px;">'+fmtDateLong(state.historyOpenDate)+'</div>';
      html += sessionEditorHtml(session, false);
      viewEl.innerHTML = html;
      viewEl.querySelector('[data-action="backToList"]').addEventListener('click', function(){
        state.historyOpenDate = null; render();
      });
      wireSessionEditor(session, false);
      return;
    }

    var dates = Object.keys(state.sessions).sort().reverse();
    if(dates.length === 0){
      viewEl.innerHTML = '<div class="card empty">Todavía no registraste ninguna sesión.</div>';
      return;
    }
    var html = '<div class="card" style="padding:4px 16px;">';
    dates.forEach(function(d){
      var s = state.sessions[d];
      var summary = setsSummary(s);
      var dur = (s.startedAt && s.finishedAt) ? ' · '+fmtDuration(s.finishedAt-s.startedAt) : '';
      html += '<button class="history-item" data-date="'+d+'">' +
        '<span><span class="history-date">'+fmtDateShort(d)+' · '+escapeHtml(s.label)+'</span>' +
        '<div class="history-sub">'+summary.done+'/'+summary.total+' ejercicios'+dur+'</div></span>' +
        '<span class="pill">'+(DAY_LABEL[s.dayKey]||'')+'</span>' +
      '</button>';
    });
    html += '</div>';
    viewEl.innerHTML = html;
    viewEl.querySelectorAll('.history-item').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.historyOpenDate = btn.getAttribute('data-date'); render();
      });
    });
  }

  /* ---------- navegación ---------- */
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){ setTab(btn.getAttribute('data-tab')); });
  });

  /* ---------- PWA: service worker (no rompe nada si falla) ----------
     El manifest y los theme-color van declarados en el <head>, no inyectados aca. */
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ clearInterval(state.liveInterval); }
    else { render(); }
  });

  /* ---------- arranque ---------- */
  render();
})();
</script>
