  /* ---------- PWA: service worker (no rompe nada si falla) ----------
     El manifest y los theme-color van declarados en el <head>, no inyectados aca. */
  /* APP_VERSION tiene que coincidir con CACHE_NAME en sw.js (bitacora-vNN). */
  var APP_VERSION = '23';
  var versionPill = document.getElementById('versionPill');
  versionPill.textContent = 'v' + APP_VERSION;
  var swReg = null;

  versionPill.addEventListener('click', function(){
    /* Los datos se guardan al tipear, asi que recargar no pierde nada. */
    if(versionPill.classList.contains('update')){ location.reload(); return; }
    versionPill.textContent = 'Buscando…';
    var reloaded = false;
    var done = function(){ if(!reloaded){ reloaded = true; location.reload(); } };
    setTimeout(done, 4000);   // sin señal update() puede tardar: no dejar la pildora colgada
    if(swReg){ swReg.update().then(done, done); } else { done(); }
  });

  if('serviceWorker' in navigator){
    var hadController = !!navigator.serviceWorker.controller;
    /* Si una version nueva toma el control con la app abierta, avisar en la
       pildora en vez de recargar solo (podrias estar escribiendo un peso). */
    /* Ojo: la pagina se pide primero a la red, asi que casi siempre ya es la
       nueva cuando el SW nuevo toma el control. Por eso se le pregunta la
       version al SW y solo se avisa si no coincide con la de esta pagina. */
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(!hadController){ hadController = true; return; }
      var ctrl = navigator.serviceWorker.controller;
      if(!ctrl || typeof MessageChannel === 'undefined') return;
      var ch = new MessageChannel();
      ch.port1.onmessage = function(ev){
        if(ev.data && ev.data !== 'bitacora-v' + APP_VERSION){
          versionPill.textContent = 'Nueva versión ↻';
          versionPill.classList.add('update');
        }
      };
      ctrl.postMessage('version', [ch.port2]);
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(reg){
        swReg = reg;
        reg.update().catch(function(){});
      }).catch(function(){});
    });
  }

  /* Al volver a la app solo se redibuja si cambio el dia (la app quedo abierta
     de un dia para otro). Redibujar siempre cerraba el teclado y perdia el
     foco cada vez que se desbloqueaba el celu entre series. */
  var lastVisibleDay = isoDate(today());
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    tickClock();
    var d = isoDate(today());
    if(d !== lastVisibleDay){ lastVisibleDay = d; render(); }
  });

  /* ---------- reloj ----------
     Hora real siempre, tambien en modo prueba (la fecha simulada no lo toca).
     Se mira cada 250 ms y se escribe solo si cambio el segundo: con un timer
     por segundo, el celu a veces lo atrasaba y el reloj saltaba o se trababa. */
  var clockEl = document.getElementById('clock');
  var clockTimer = null;
  function tickClock(){
    var d = new Date();
    var txt = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    if(clockEl.textContent !== txt) clockEl.textContent = txt;
  }
  tickClock();
  clockTimer = setInterval(tickClock, 250);

  /* ---------- modo prueba ---------- */
  function seedTestData(weeks){
    var all = {};
    var d = today();
    var made = 0;
    for(var back = 1; back <= weeks*7 && made < weeks*5; back++){
      var day = new Date(d.getFullYear(), d.getMonth(), d.getDate() - back);
      var wk = weekdayKeyOf(day);
      if(DAY_ORDER.indexOf(wk) === -1) continue;   // solo lunes a viernes
      var iso = isoDate(day);
      var exs = cloneExercisesFromTemplate(wk).map(function(e, i){
        if(e.kind === 'cardio'){
          e.minutes = (back % 2 === 0) ? 10 : 15;
        } else {
          // pesos plausibles, subiendo un poco hacia el presente
          var base = [60, 22.5, 35, 40, 50][i % 5];
          e.weight = String(base - Math.floor(back/7) * 2.5);
        }
        e.done = true;
        return e;
      });
      var start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 18, 30).getTime();
      all[iso] = {
        date: iso, dayKey: wk,
        label: (state.template[wk] && state.template[wk].focus) || 'Entreno',
        finishedAt: start,
        exercises: exs
      };
      made++;
    }
    Object.keys(all).forEach(function(k){ state.sessions[k] = all[k]; });
    saveSessions();
    return made;
  }

  function wipeTestData(){
    [LS_TEMPLATE, LS_SESSIONS, LS_UI, LS_TESTDATE, LS_TPLVER].forEach(function(k){
      try{ localStorage.removeItem(k); }catch(e){}
    });
  }

  function mountTestBar(){
    var bar = document.createElement('div');
    bar.className = 'test-bar';
    var current = safeGet(LS_TESTDATE) || isoDate(new Date());
    bar.innerHTML =
      '<div class="test-title">Modo prueba · datos aparte, no toca tu historial real</div>' +
      '<div class="test-row">' +
        '<input type="date" id="testDate" value="'+current+'">' +
        '<button id="testPrev" type="button">◀ día</button>' +
        '<button id="testNext" type="button">día ▶</button>' +
      '</div>' +
      '<div class="test-row">' +
        '<button id="testSeed" type="button">Sembrar 2 semanas</button>' +
        '<button id="testWipe" type="button" class="danger">Borrar datos de prueba</button>' +
        '<button id="testExit" type="button">Salir</button>' +
      '</div>';
    var topbar = document.querySelector('.topbar');
    topbar.parentNode.insertBefore(bar, topbar.nextSibling);

    function setDate(iso){ safeSet(LS_TESTDATE, iso); document.getElementById('testDate').value = iso; render(); }
    function shift(days){
      var d = today();
      setDate(isoDate(new Date(d.getFullYear(), d.getMonth(), d.getDate() + days)));
    }

    document.getElementById('testDate').addEventListener('change', function(){
      if(this.value) setDate(this.value);
    });
    document.getElementById('testPrev').addEventListener('click', function(){ shift(-1); });
    document.getElementById('testNext').addEventListener('click', function(){ shift(1); });

    document.getElementById('testSeed').addEventListener('click', function(){
      var n = seedTestData(2);
      this.textContent = n + ' sesiones creadas ✓';
      var btn = this;
      setTimeout(function(){ btn.textContent = 'Sembrar 2 semanas'; }, 2500);
      render();
    });

    /* Borrar es destructivo aunque sean datos de prueba: doble confirmacion. */
    var wipeBtn = document.getElementById('testWipe');
    wipeBtn.addEventListener('click', function(){
      if(wipeBtn.dataset.armed === '1'){
        wipeTestData();
        /* Salir del modo prueba, no recargar dentro de el: al arrancar, la app
           recrea la plantilla por defecto y volveria a dejar claves _test. */
        location.href = location.pathname;
      } else {
        wipeBtn.dataset.armed = '1';
        wipeBtn.textContent = '¿Seguro? Tocá de nuevo';
        setTimeout(function(){
          wipeBtn.dataset.armed = '0';
          wipeBtn.textContent = 'Borrar datos de prueba';
        }, 4000);
      }
    });

    document.getElementById('testExit').addEventListener('click', function(){
      location.href = location.pathname;
    });
  }

  if(TEST_MODE) mountTestBar();

  /* ---------- arranque ---------- */
  render();
})();
</script>
